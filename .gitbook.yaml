root: ./docs/

structure:
    readme: README.md
    summary: SUMMARY.md

# Redirect manifest for the docs migration (see .sisyphus/plans/docs-migration-v3.md).
# Rules (per GitBook docs):
#   - Paths are relative to `root` (no leading slash).
#   - The old source file MUST be removed/renamed, or the redirect is ignored.
#   - Never chain redirects: map every historical URL directly to its final destination.
# Verified in CI by scripts/check-docs-links.mjs.
redirects:
    how-to-guides/implement-flows/chapi: introduction/interoperability.md
    how-to-guides/implement-flows/chapi/chapi-wallet-setup-guide: introduction/interoperability.md
