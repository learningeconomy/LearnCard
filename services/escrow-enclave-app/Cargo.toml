[package]
name = "escrow-enclave"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
resolver = "3"
publish = false
description = "LearnCard escrow enclave scaffold"
license = "MIT"

[[bin]]
name = "escrow-enclave"
path = "src/main.rs"
required-features = ["enclave-runtime"]

[lib]
path = "src/lib.rs"

[features]
default = ["enclave-runtime"]
# Preserve the default enclave; verifier consumers can omit recipient RSA and transports.
enclave-runtime = ["dep:rsa", "dep:cms", "dep:cbc"]
fake-nsm = ["dep:p384", "dep:x509-cert", "sha2/oid"]
fake-kms = ["enclave-runtime"]
fake-time = []
fake-ledger = []
verified-roughtime-keys = []
nitro = ["enclave-runtime", "dep:aws-nitro-enclaves-nsm-api", "dep:aws-nitro-enclaves-cose"]
kms = ["enclave-runtime", "dep:aws-config", "dep:aws-sdk-kms"]

[dependencies]
tokio = { version = "~1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.151"
ciborium = "~0.2.2"
serde_bytes = "~0.11.19"
# Keep the RustCrypto family compatible with stable rsa 0.9 (digest 0.10 / rand_core 0.6).
sha2 = "~0.10.9"
hkdf = "~0.12.4"
p256 = { version = "~0.13.2", features = ["ecdh", "ecdsa", "pkcs8"] }
aes-gcm = { version = "~0.10.3", features = ["zeroize"] }
rand_core = { version = "~0.6.4", features = ["getrandom"] }
rand = "~0.8.8"
zeroize = { version = "~1.9.0", features = ["derive"] }
thiserror = "~2.0.21"
tracing = "~0.1.44"
tracing-subscriber = "~0.3.23"
base64 = "~0.23.1"
hex = "~0.4.3"
ed25519-dalek = "~2.2.0"
subtle = "~2.6.1"
aws-nitro-enclaves-nsm-api = { version = "~0.5.2", optional = true }
aws-nitro-enclaves-cose = { version = "~0.5.2", optional = true }
# Newer AWS minor releases require Rust 1.94.1; resolver 3 also respects transitive MSRVs.
aws-config = { version = "~1.8.18", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
# The SDK's default `rustls` feature also enables legacy hyper 0.14 / rustls 0.21.
# Select only the current hyper 1 / rustls 0.23 / AWS-LC HTTPS client.
aws-sdk-kms = { version = "~1.111.0", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
rsa = { version = "~0.9.10", optional = true, features = ["sha2"] }
cms = { version = "~0.2.3", optional = true, features = ["std"] }
# Also enables AES-GCM's underlying key-schedule wiping in the default build.
aes = { version = "~0.8.4", features = ["zeroize"] }
cbc = { version = "~0.1.2", optional = true, features = ["alloc", "zeroize"] }
der = { version = "~0.7.10", features = ["alloc", "derive", "oid"] }
p384 = { version = "~0.13.1", optional = true, features = ["ecdsa", "pkcs8"] }
x509-cert = { version = "~0.2.5", optional = true, features = ["builder"] }

[dev-dependencies]
sha2 = { version = "~0.10.9", features = ["oid"] }
p384 = { version = "~0.13.1", features = ["ecdsa", "pkcs8"] }
x509-cert = { version = "~0.2.5", features = ["builder"] }
der = { version = "~0.7.10", features = ["alloc", "derive", "oid"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "~0.7.2"

[profile.release]
panic = "abort"
