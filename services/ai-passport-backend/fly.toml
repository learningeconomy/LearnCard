#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

primary_region = 'sea'

[env]
  AWS_REGION = "us-east-1"
  AWS_ROLE_ARN = "arn:aws:iam::206533012615:role/ai-passport-privacy-runtime"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 3001
  force_https = true
  # Return idle API Machines to the normal cost-saving policy after backfill.
  # Repository changes take effect only through an authorized deployment.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
