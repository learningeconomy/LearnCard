# serverless.yml

service: ${env:SERVERLESS_SERVICE_NAME, 'lcn-brain-service'}

frameworkVersion: '3'

useDotenv: true

plugins:
    - serverless-esbuild
    - serverless-offline
    - serverless-domain-manager
    - serverless-certificate-creator
    - serverless-lift
    - serverless-prune-plugin

constructs:
    inbox-queue:
        type: queue
        batchSize: 1
        maxConcurrency: 10
        maxRetries: 5
        worker:
            handler: lambda.inboxQueueWorker
            timeout: 300
            reservedConcurrency: 10
            vpc:
                securityGroupIds:
                    - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
                subnetIds:
                    - Ref: PrivateSubnetA
    notifications-queue:
        type: queue
        worker:
            handler: lambda.notificationsWorker

custom:
    prune:
        automatic: true
        number: 3
    config:
        CACHE_INSTANCE_SIZE: ${env:SERVERLESS_CACHE_INSTANCE_SIZE, 'cache.t2.micro'}
    esbuild:
        # serverless-esbuild does not support Bun as a Lambda artifact packager.
        # Bun remains the repo installer/runner; pnpm is used only for packaging externals.
        packager: pnpm
        plugins: esbuildPlugins.cjs
        bundle: true
        minify: true
        external: ['@learncard/didkit-plugin/dist/didkit_wasm_bg.wasm', '*.node', 'p-limit']
        # didkit-plugin-node ships via the didkitNative Lambda Layer. `exclude` both
        # marks it esbuild-external AND stops the packager from installing a
        # binary-less registry copy into the artifact (which would shadow the layer,
        # since /var/task/node_modules wins over NODE_PATH). 'aws-sdk' is the
        # serverless-esbuild default and must be preserved when overriding.
        exclude: ['aws-sdk', '@learncard/didkit-plugin-node']
        sourcemap: external
        target: 'node20'
        watch:
            pattern: ['src/**/*.ts', 'dids.ts']

    domains:
        # References to 'prod' stage
        production:
            hostedZoneName: ${env:SERVERLESS_HOSTED_ZONE_NAMES, 'network.learncard.com.'}
            domainName: ${env:SERVERLESS_DOMAIN_NAME, 'network.learncard.com'}
            certificateName: ${env:SERVERLESS_DOMAIN_NAME, 'network.learncard.com'}

        # References to 'dev' stage
        dev:
            hostedZoneName: ${env:SERVERLESS_HOSTED_ZONE_NAMES, 'network.learncard.com.'}
            domainName: ${env:SERVERLESS_DOMAIN_NAME, 'staging.network.learncard.com'}
            certificateName: ${env:SERVERLESS_DOMAIN_NAME, 'staging.network.learncard.com'}

    # Amazon Certificate Manager
    customCertificate:
        # Route 53 Hosted Zone name
        # don't forget the dot on the end!
        hostedZoneNames: ${self:custom.domains.${self:provider.stage}.hostedZoneName}

        # Here we get our certificate name inside custom.domain.STAGE.certificateName
        # STAGE will be automatically filled with the value from "provider > stage"
        certificateName: ${self:custom.domains.${self:provider.stage}.certificateName}

        region: ${self:provider.region}

    # Route53
    customDomain:
        # Get value from "domains" section using stage that is being deployed
        domainName: ${self:custom.domains.${self:provider.stage}.domainName}

        # Same case of certificaName inside customCertificate
        certificateName: ${self:custom.domains.${self:provider.stage}.certificateName}

        # Enable plugin to create an A Alias and AAAA Alias records in Route53
        # mapping the domainName to the generated distribution domain name.
        createRoute53Record: true

        # Enable plugin to autorun create_domain/delete_domain as part of sls deploy/remove
        autoDomain: true

        basePath: ''
        endpointType: regional
        apiType: http

package:
    individually: true
    # DIDKit assets no longer ship via node_modules copy-patterns: those globs were
    # service-relative and match nothing under Bun workspaces (root cause of the
    # 2026-07-02 staging incident, PR #1341) — and if a service-level node_modules
    # ever reappeared, force-including didkit-plugin-node here would shadow the
    # didkitNative Lambda Layer (/var/task/node_modules wins over NODE_PATH). The
    # WASM ships inside the bundle (esbuildPlugins.cjs); native ships via the Layer.
    patterns:
        - '!node_modules/**'

# Ships @learncard/didkit-plugin-node (JS wrapper + linux-x64 napi binary) and
# its runtime @learncard/didkit-plugin dependency at /opt/nodejs/node_modules so
# the native-first DIDKit path in learnCard.helpers.ts resolves in Lambda instead
# of silently falling back to WASM. Assembled by scripts/prepare-didkit-native-layer.cjs.
layers:
    didkitNative:
        path: didkit-native-layer
        name: ${self:service}-${opt:stage, 'dev'}-didkit-native
        description: Native DIDKit napi addon and runtime DIDKit dependency
        compatibleRuntimes:
            - nodejs20.x
        compatibleArchitectures:
            - x86_64

provider:
    name: aws
    runtime: nodejs20.x
    # Attach the native DIDKit layer to every function in this service.
    layers:
        - { Ref: DidkitNativeLambdaLayer }
    memorySize: 2048
    timeout: 29
    stage: ${opt:stage, "dev"}
    region: ${opt:region, "us-east-1"}
    # Every function shares the default execution role. Grant it read access to the stage's
    # runtime-secrets bundle only; the id itself is passed through RUNTIME_SECRETS_ID.
    iam:
        role:
            statements:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                      Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:brain-service/${sls:stage}/runtime-secrets-*
    # Bundle mode emits only infra (Redis/queue CF intrinsics, the bundle pointer and the
    # deploy commit); fallback mode retains the existing GitHub credential secrets. Non-secret
    # per-stage tuning, allowlists and OIDC/share-link config are applied from checked-in stage
    # config at cold start, never forwarded here. LAMBDA_STAGE comes from the CLI stage option.
    environment: ${file(./serverless.function-env.cjs):provider}
    tracing:
        apiGateway: true
        lambda: true
    httpApi:
        cors:
            allowedOrigins: '*'
            allowedHeaders: '*'
            allowedMethods: '*'
            exposedResponseHeaders:
                - WWW-Authenticate
                - ETag

functions:
    inboxDeadLetterWorker:
        handler: lambda.inboxDeadLetterWorker
        timeout: 30
        reservedConcurrency: 2
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - sqs:
                  arn: ${construct:inbox-queue.dlqArn}
                  batchSize: 1
                  functionResponseType: ReportBatchItemFailures
    inboxQueueDispatcher:
        handler: lambda.inboxQueueDispatcher
        timeout: 60
        reservedConcurrency: 1
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - schedule: rate(1 minute)
    inboxMaintenance:
        handler: lambda.inboxMaintenanceHandler
        timeout: 300
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - schedule:
                  rate: rate(1 day)
                  enabled: true

    # Retry durable consent notification intents once per minute.
    contractEvents:
        handler: contractEventsLambda.contractEventsHandler
        timeout: 60
        reservedConcurrency: 1
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - schedule: rate(1 minute)

    # LC-2187 share-link recovery + cleanup. Dedicated entrypoint (no lambda.ts
    # import-time work). Runs automatically with valid service configuration;
    # absent wiring remains inert and partial wiring fails closed. The cadence
    # matches the default Docker maintenance interval (5 minutes).
    shareLinkMaintenance:
        handler: shareLinkMaintenanceLambda.shareLinkMaintenanceHandler
        timeout: 300
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - schedule:
                  rate: rate(5 minutes)
                  enabled: true

    trpc:
        handler: lambda.trpcHandler
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: ANY /trpc/{trpc+}

    api:
        handler: lambda.openApiHandler
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: ANY /api/{trpc+}

    didWeb:
        handler: didWebLambda.didWebHandler
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: GET /users/{params+}
            - httpApi: OPTIONS /users/{params+}
            - httpApi: GET /manager/{params+}
            - httpApi: OPTIONS /manager/{params+}
            - httpApi: GET /app/{params+}
            - httpApi: OPTIONS /app/{params+}
            - httpApi: GET /.well-known/did.json
            - httpApi: OPTIONS /.well-known/did.json
        url:
            cors: true

    swagger:
        handler: lambda.swaggerUiHandler
        events:
            - httpApi: GET /docs
            - httpApi: GET /docs/{trpc+}

    skillsViewer:
        handler: lambda.skillsViewerHandler
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: GET /skills/{skillId}
            - httpApi: GET /frameworks/{frameworkId}
            - httpApi: GET /frameworks/{frameworkId}/skills/{skillId}

    statusLists:
        handler: lambda.statusListsHandler
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: GET /status-lists/{id}
            - httpApi: OPTIONS /status-lists/{id}

    credentialRefresh:
        handler: lambda.credentialRefreshHandler
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: GET /refresh/{refreshId}
            - httpApi: OPTIONS /refresh/{refreshId}
            - httpApi: GET /refresh/{refreshId}/history
            - httpApi: OPTIONS /refresh/{refreshId}/history
            - httpApi: GET /refresh/{refreshId}/versions/{version}
            - httpApi: OPTIONS /refresh/{refreshId}/versions/{version}

resources:
    Resources:
        InboxQueueAgeAlarm:
            Type: AWS::CloudWatch::Alarm
            Properties:
                AlarmDescription: Inbox issuance has waited over five minutes
                Namespace: AWS/SQS
                MetricName: ApproximateAgeOfOldestMessage
                Dimensions:
                    - Name: QueueName
                      Value:
                          Fn::Select:
                              - 4
                              - Fn::Split: ['/', '${construct:inbox-queue.queueUrl}']
                Statistic: Maximum
                Period: 60
                EvaluationPeriods: 2
                Threshold: 300
                ComparisonOperator: GreaterThanThreshold
                TreatMissingData: notBreaching
        InboxDispatcherErrorsAlarm:
            Type: AWS::CloudWatch::Alarm
            Properties:
                AlarmDescription: Durable inbox dispatch or recovery failed in three of five minutes
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                    - Name: FunctionName
                      Value: { Ref: InboxQueueDispatcherLambdaFunction }
                Statistic: Sum
                Period: 60
                EvaluationPeriods: 5
                DatapointsToAlarm: 3
                Threshold: 0
                ComparisonOperator: GreaterThanThreshold
                TreatMissingData: notBreaching
        VPC:
            Type: AWS::EC2::VPC
            Properties:
                CidrBlock: '10.0.0.0/16'
        IP:
            Type: AWS::EC2::EIP
            Properties:
                Domain: vpc
        InternetGateway:
            Type: AWS::EC2::InternetGateway
        VPCGatewayAttachment:
            Type: AWS::EC2::VPCGatewayAttachment
            Properties:
                VpcId:
                    Ref: VPC
                InternetGatewayId:
                    Ref: InternetGateway
        NatGateway:
            Type: AWS::EC2::NatGateway
            Properties:
                AllocationId:
                    Fn::GetAtt:
                        - IP
                        - AllocationId
                SubnetId:
                    Ref: PublicSubnetA
        PrivateSubnetA:
            DependsOn: VPC
            Type: AWS::EC2::Subnet
            Properties:
                VpcId:
                    Ref: VPC
                AvailabilityZone: ${self:provider.region}a
                CidrBlock: '10.0.1.0/24'
        PublicSubnetA:
            DependsOn: VPC
            Type: AWS::EC2::Subnet
            Properties:
                VpcId:
                    Ref: VPC
                AvailabilityZone: ${self:provider.region}a
                CidrBlock: '10.0.2.0/24'
        PrivateRouteTable:
            Type: AWS::EC2::RouteTable
            Properties:
                VpcId:
                    Ref: VPC
        PrivateRoute:
            Type: AWS::EC2::Route
            Properties:
                RouteTableId:
                    Ref: PrivateRouteTable
                DestinationCidrBlock: 0.0.0.0/0
                NatGatewayId:
                    Ref: NatGateway
        PublicRouteTable:
            Type: AWS::EC2::RouteTable
            Properties:
                VpcId:
                    Ref: VPC
        PublicRoute:
            Type: AWS::EC2::Route
            Properties:
                RouteTableId:
                    Ref: PublicRouteTable
                DestinationCidrBlock: 0.0.0.0/0
                GatewayId:
                    Ref: InternetGateway
        SubnetRouteTableAssociationLambdaPrivateA:
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
                SubnetId:
                    Ref: PrivateSubnetA
                RouteTableId:
                    Ref: PrivateRouteTable
        SubnetRouteTableAssociationLambdaPublicA:
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
                SubnetId:
                    Ref: PublicSubnetA
                RouteTableId:
                    Ref: PublicRouteTable
        ServerlessSecurityGroup:
            DependsOn: VPC
            Type: AWS::EC2::SecurityGroup
            Properties:
                GroupDescription: SecurityGroup for Serverless Functions
                VpcId:
                    Ref: VPC
        ServerlessStorageSecurityGroup:
            DependsOn: VPC
            Type: AWS::EC2::SecurityGroup
            Properties:
                GroupDescription: Ingress for Redis Cluster
                VpcId:
                    Ref: VPC
                SecurityGroupIngress:
                    - IpProtocol: tcp
                      FromPort: '6379'
                      ToPort: '6379'
                      SourceSecurityGroupId:
                          Ref: ServerlessSecurityGroup
        ServerlessCacheSubnetGroup:
            Type: AWS::ElastiCache::SubnetGroup
            Properties:
                Description: 'Cache Subnet Group'
                SubnetIds:
                    - Ref: PrivateSubnetA
        ElasticCacheCluster:
            DependsOn: ServerlessStorageSecurityGroup
            Type: AWS::ElastiCache::CacheCluster
            Properties:
                AutoMinorVersionUpgrade: true
                Engine: redis
                CacheNodeType: ${self:custom.config.CACHE_INSTANCE_SIZE}
                NumCacheNodes: 1
                VpcSecurityGroupIds:
                    - 'Fn::GetAtt': [ServerlessStorageSecurityGroup, GroupId]
                CacheSubnetGroupName:
                    Ref: ServerlessCacheSubnetGroup
