# serverless.yml

service: ${env:SERVERLESS_SERVICE_NAME, 'lca-api-service'}

frameworkVersion: '3'

useDotenv: true

plugins:
    - serverless-esbuild
    - serverless-domain-manager
    - serverless-certificate-creator
    - serverless-prune-plugin

custom:
    prune:
        automatic: true
        number: 3
    config:
        CACHE_INSTANCE_SIZE: cache.t2.micro
    esbuild:
        # serverless-esbuild does not support Bun as a Lambda artifact packager.
        # Bun remains the repo installer/runner; pnpm is used only for packaging externals.
        packager: pnpm
        plugins: esbuildPlugins.cjs
        bundle: true
        minify: true
        # @learncard/init's default (node.import) entry uses createRequire('./index.cjs'),
        # which esbuild cannot bundle — the emitted Lambda bundle is left with a runtime
        # require('./index.cjs') that does not exist next to the output, so the function
        # throws at init and every route 500s. Point esbuild at init's self-contained
        # bundler ESM build instead. (See LC staging incident 2026-06-11 / PR #1297.)
        alias:
            '@learncard/init': '@learncard/init/dist/init.esm.js'
        external:
            [
                'snappy',
                '@learncard/didkit-plugin/dist/didkit_wasm_bg.wasm',
                '@learncard/didkit-plugin-node/*.node',
            ]
        # didkit-plugin-node ships via the didkitNative Lambda Layer. `exclude` both
        # marks it esbuild-external AND stops the packager from installing a
        # binary-less registry copy into the artifact (which would shadow the layer,
        # since /var/task/node_modules wins over NODE_PATH). 'aws-sdk' is the
        # serverless-esbuild default and must be preserved when overriding.
        exclude: ['aws-sdk', '@learncard/didkit-plugin-node']
        sourcemap: external
        target: 'node20'
        watch:
            pattern: ['src/**/*.ts', 'dids.ts']

    domains:
        # References to 'prod' stage
        production:
            hostedZoneName: ${env:SERVERLESS_HOSTED_ZONE_NAMES, 'api.learncard.app.'}
            domainName: ${env:SERVERLESS_DOMAIN_NAME, 'api.learncard.app'}
            certificateName: ${env:SERVERLESS_DOMAIN_NAME, 'api.learncard.app'}

        # References to 'dev' stage
        dev:
            hostedZoneName: ${env:SERVERLESS_HOSTED_ZONE_NAMES, 'api.learncard.app.'}
            domainName: ${env:SERVERLESS_DOMAIN_NAME, 'staging.api.learncard.app'}
            certificateName: ${env:SERVERLESS_DOMAIN_NAME, 'staging.api.learncard.app'}

    # Amazon Certificate Manager
    customCertificate:
        # Route 53 Hosted Zone name
        # don't forget the dot on the end!
        hostedZoneNames: ${self:custom.domains.${self:provider.stage}.hostedZoneName}

        # Here we get our certificate name inside custom.domain.STAGE.certificateName
        # STAGE will be automatically filled with the value from "provider > stage"
        certificateName: ${self:custom.domains.${self:provider.stage}.certificateName}

        region: ${self:provider.region}

    # Route53
    customDomain:
        # Get value from "domains" section using stage that is being deployed
        domainName: ${self:custom.domains.${self:provider.stage}.domainName}

        # Same case of certificaName inside customCertificate
        certificateName: ${self:custom.domains.${self:provider.stage}.certificateName}

        # Enable plugin to create an A Alias and AAAA Alias records in Route53
        # mapping the domainName to the generated distribution domain name.
        createRoute53Record: true

        # Enable plugin to autorun create_domain/delete_domain as part of sls deploy/remove
        autoDomain: true

        basePath: ''
        endpointType: regional
        apiType: http

package:
    individually: true
    # DIDKit assets no longer ship via node_modules copy-patterns: those globs were
    # service-relative and match nothing under Bun workspaces (root cause of the
    # 2026-07-02 staging incident, PR #1341) — and if a service-level node_modules
    # ever reappeared, force-including didkit-plugin-node here would shadow the
    # didkitNative Lambda Layer (/var/task/node_modules wins over NODE_PATH). The
    # WASM ships inside the bundle (esbuildPlugins.cjs); native ships via the Layer.
    patterns:
        - '!node_modules/**'
        - 'src/swagger-ui'

# Ships @learncard/didkit-plugin-node (JS wrapper + linux-x64 napi binary) and
# its runtime @learncard/didkit-plugin dependency at /opt/nodejs/node_modules so
# the native-first DIDKit path in learnCard.helpers.ts resolves in Lambda instead
# of silently falling back to WASM. Assembled by scripts/prepare-didkit-native-layer.cjs.
layers:
    didkitNative:
        path: didkit-native-layer
        name: ${self:service}-${opt:stage, 'dev'}-didkit-native
        description: Native DIDKit napi addon and runtime DIDKit dependency
        compatibleRuntimes:
            - nodejs20.x
        compatibleArchitectures:
            - x86_64

provider:
    name: aws
    runtime: nodejs20.x
    # Attach the native DIDKit layer to every function in this service.
    layers:
        - { Ref: DidkitNativeLambdaLayer }
    memorySize: 2048
    timeout: 29
    stage: ${opt:stage, "dev"}
    region: ${opt:region, "us-east-1"}
    # Bundle mode emits only infra; fallback mode retains the existing GitHub secrets.
    environment: ${file(./serverless.function-env.cjs):provider}
    # Only didWeb/swagger use this generated role. Explicit function roles do not inherit it.
    # Bundle access must not grant cryptographic use of the hosted signing-authority KMS key.
    iam:
        role:
            statements:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                      Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lca-api/${sls:stage}/runtime-secrets-*
    tracing:
        apiGateway: true
        lambda: true
    httpApi:
        cors:
            allowedOrigins: '*'
            allowedHeaders: '*'
            allowedMethods: '*'

functions:
    trpc:
        handler: lambda.trpcHandler
        role: SigningAuthorityExecutionRole
        dependsOn: [SigningAuthoritySeedKeyPolicy]
        environment: ${file(./serverless.function-env.cjs):api}
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: ANY /trpc/{trpc+}

    api:
        handler: lambda.openApiHandler
        role: SigningAuthorityExecutionRole
        dependsOn: [SigningAuthoritySeedKeyPolicy]
        environment: ${file(./serverless.function-env.cjs):api}
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: ANY /api/{trpc+}

    didWeb:
        handler: lambda.didWebHandler
        environment: ${file(./serverless.function-env.cjs):api}
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: GET /users/{params+}
            - httpApi: GET /.well-known/did.json
        url:
            cors: true

    oidc:
        handler: oidcLambda.handler
        # Only this function may read the private signing key (see OidcExecutionRole).
        role: OidcExecutionRole
        environment: ${file(./serverless.function-env.cjs):oidc}
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        events:
            - httpApi: GET /.well-known/openid-configuration
            - httpApi: ANY /oidc/{proxy+}

    seedMigration:
        handler: seedMigrationLambda.handler
        role: SigningAuthorityExecutionRole
        timeout: 900
        reservedConcurrency: 1
        dependsOn: [SigningAuthoritySeedKeyPolicy]
        # Shares the SigningAuthority role, so it reads the runtime bundle when present and
        # falls back to the same credentials as trpc/api otherwise (it needs SEED + Mongo).
        environment: ${file(./serverless.function-env.cjs):api}
        # IAM invoke only: intentionally no events, schedule, or function URL.
        vpc:
            securityGroupIds:
                - Fn::GetAtt: [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA

    swagger:
        handler: lambda.swaggerUiHandler
        environment: ${file(./serverless.function-env.cjs):api}
        vpc:
            securityGroupIds:
                - 'Fn::GetAtt': [ServerlessSecurityGroup, GroupId]
            subnetIds:
                - Ref: PrivateSubnetA
        package:
            patterns:
                - src/swagger-ui/**
        events:
            - httpApi: GET /docs
            - httpApi: GET /docs/{trpc+}

resources:
    Outputs:
        SigningAuthoritySeedKeyArn:
            Value:
                Fn::GetAtt: [SigningAuthoritySeedKey, Arn]
        SigningAuthoritySeedMigrationFunctionName:
            Value:
                Ref: SeedMigrationLambdaFunction
    Resources:
        # Only the two signing entry points and the migration worker assume this role.
        # Keep KMS references out of the role itself to avoid a Role -> Key -> Role cycle.
        SigningAuthorityExecutionRole:
            Type: AWS::IAM::Role
            Properties:
                AssumeRolePolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Effect: Allow
                          Principal:
                              Service: lambda.amazonaws.com
                          Action: sts:AssumeRole
                ManagedPolicyArns:
                    - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess
                Policies:
                    - PolicyName: runtime-secrets
                      PolicyDocument:
                          Version: '2012-10-17'
                          Statement:
                              # seedMigration shares this role; bundle access is acceptable for now.
                              - Effect: Allow
                                Action: secretsmanager:GetSecretValue
                                Resource:
                                    Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lca-api/${sls:stage}/runtime-secrets-*
        OidcExecutionRole:
            Type: AWS::IAM::Role
            Properties:
                AssumeRolePolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Effect: Allow
                          Principal:
                              Service: lambda.amazonaws.com
                          Action: sts:AssumeRole
                ManagedPolicyArns:
                    - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess
                Policies:
                    - PolicyName: oidc-signing-key
                      PolicyDocument:
                          Version: '2012-10-17'
                          Statement:
                              # SecretString is the private JWK JSON; only its id belongs in Lambda env.
                              - Effect: Allow
                                Action: secretsmanager:GetSecretValue
                                Resource:
                                    Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lca-api/${sls:stage}/oidc-signing-jwk-*
        SigningAuthoritySeedKey:
            Type: AWS::KMS::Key
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
                Description: Envelope encryption for hosted signing-authority seeds
                KeySpec: SYMMETRIC_DEFAULT
                KeyUsage: ENCRYPT_DECRYPT
                EnableKeyRotation: true
                PendingWindowInDays: 30
                KeyPolicy:
                    Version: '2012-10-17'
                    Statement:
                        - Sid: AccountKeyAdministration
                          Effect: Allow
                          Principal:
                              AWS:
                                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
                          Action:
                              - kms:DescribeKey
                              - kms:GetKeyPolicy
                              - kms:PutKeyPolicy
                              - kms:ListResourceTags
                              - kms:TagResource
                              - kms:UntagResource
                              - kms:GetKeyRotationStatus
                              - kms:EnableKeyRotation
                              - kms:DisableKeyRotation
                              - kms:UpdateKeyDescription
                              - kms:EnableKey
                              - kms:DisableKey
                              - kms:ScheduleKeyDeletion
                              - kms:CancelKeyDeletion
                              - kms:CreateAlias
                              - kms:UpdateAlias
                              - kms:DeleteAlias
                          Resource: '*'
                        - Sid: LcaApiSeedEncryption
                          Effect: Allow
                          Principal:
                              AWS:
                                  Fn::GetAtt: [SigningAuthorityExecutionRole, Arn]
                          Action: [kms:GenerateDataKey, kms:Decrypt]
                          Resource: '*'
                          Condition:
                              StringEquals:
                                  kms:EncryptionContext:purpose: lca-signing-authority-seed
                        - Sid: DenyOtherCryptographicPrincipals
                          Effect: Deny
                          Principal: '*'
                          Action:
                              [kms:Decrypt, 'kms:ReEncrypt*', 'kms:GenerateDataKey*', kms:Encrypt]
                          Resource: '*'
                          Condition:
                              ArnNotEquals:
                                  aws:PrincipalArn:
                                      Fn::GetAtt: [SigningAuthorityExecutionRole, Arn]
        SigningAuthoritySeedKeyAlias:
            Type: AWS::KMS::Alias
            Properties:
                AliasName: alias/${self:service}-${self:provider.stage}-sa-seeds
                TargetKeyId:
                    Ref: SigningAuthoritySeedKey
        # The direct execution-role grant in the KEY policy authorizes cryptographic use.
        # This matching IAM allow is not required by that grant; it documents the scope and
        # provides a dependsOn deployment barrier. Keeping it separate avoids a Role -> Key
        # -> Role CloudFormation dependency cycle. Swagger/didWeb use the generated role.
        SigningAuthoritySeedKeyPolicy:
            Type: AWS::IAM::Policy
            Properties:
                PolicyName: ${self:service}-${self:provider.stage}-sa-seeds
                Roles:
                    - Ref: SigningAuthorityExecutionRole
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                        - Effect: Allow
                          Action: [kms:GenerateDataKey, kms:Decrypt]
                          Resource:
                              Fn::GetAtt: [SigningAuthoritySeedKey, Arn]
                          Condition:
                              StringEquals:
                                  kms:EncryptionContext:purpose: lca-signing-authority-seed
        VPC:
            Type: AWS::EC2::VPC
            Properties:
                CidrBlock: '10.0.0.0/16'
        IP:
            Type: AWS::EC2::EIP
            Properties:
                Domain: vpc
        InternetGateway:
            Type: AWS::EC2::InternetGateway
        VPCGatewayAttachment:
            Type: AWS::EC2::VPCGatewayAttachment
            Properties:
                VpcId:
                    Ref: VPC
                InternetGatewayId:
                    Ref: InternetGateway
        NatGateway:
            Type: AWS::EC2::NatGateway
            Properties:
                AllocationId:
                    Fn::GetAtt:
                        - IP
                        - AllocationId
                SubnetId:
                    Ref: PublicSubnetA
        PrivateSubnetA:
            DependsOn: VPC
            Type: AWS::EC2::Subnet
            Properties:
                VpcId:
                    Ref: VPC
                AvailabilityZone: ${self:provider.region}a
                CidrBlock: '10.0.1.0/24'
        PublicSubnetA:
            DependsOn: VPC
            Type: AWS::EC2::Subnet
            Properties:
                VpcId:
                    Ref: VPC
                AvailabilityZone: ${self:provider.region}a
                CidrBlock: '10.0.2.0/24'
        PrivateRouteTable:
            Type: AWS::EC2::RouteTable
            Properties:
                VpcId:
                    Ref: VPC
        PrivateRoute:
            Type: AWS::EC2::Route
            Properties:
                RouteTableId:
                    Ref: PrivateRouteTable
                DestinationCidrBlock: 0.0.0.0/0
                NatGatewayId:
                    Ref: NatGateway
        PublicRouteTable:
            Type: AWS::EC2::RouteTable
            Properties:
                VpcId:
                    Ref: VPC
        PublicRoute:
            Type: AWS::EC2::Route
            Properties:
                RouteTableId:
                    Ref: PublicRouteTable
                DestinationCidrBlock: 0.0.0.0/0
                GatewayId:
                    Ref: InternetGateway
        SubnetRouteTableAssociationLambdaPrivateA:
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
                SubnetId:
                    Ref: PrivateSubnetA
                RouteTableId:
                    Ref: PrivateRouteTable
        SubnetRouteTableAssociationLambdaPublicA:
            Type: AWS::EC2::SubnetRouteTableAssociation
            Properties:
                SubnetId:
                    Ref: PublicSubnetA
                RouteTableId:
                    Ref: PublicRouteTable
        ServerlessSecurityGroup:
            DependsOn: VPC
            Type: AWS::EC2::SecurityGroup
            Properties:
                GroupDescription: SecurityGroup for Serverless Functions
                VpcId:
                    Ref: VPC
        ServerlessStorageSecurityGroup:
            DependsOn: VPC
            Type: AWS::EC2::SecurityGroup
            Properties:
                GroupDescription: Ingress for Redis Cluster
                VpcId:
                    Ref: VPC
                SecurityGroupIngress:
                    - IpProtocol: tcp
                      FromPort: '6379'
                      ToPort: '6379'
                      SourceSecurityGroupId:
                          Ref: ServerlessSecurityGroup
        ServerlessCacheSubnetGroup:
            Type: AWS::ElastiCache::SubnetGroup
            Properties:
                Description: 'Cache Subnet Group'
                SubnetIds:
                    - Ref: PrivateSubnetA
        ElasticCacheCluster:
            DependsOn: ServerlessStorageSecurityGroup
            Type: AWS::ElastiCache::CacheCluster
            Properties:
                AutoMinorVersionUpgrade: true
                Engine: redis
                # GETDEL (login codes/tickets/auth codes) needs Redis >= 6.2. The
                # version is deliberately NOT pinned here: existing clusters are
                # already on 7.x, and a pin below the running version is rejected
                # by CloudFormation as a downgrade (failing the whole deploy).
                CacheNodeType: ${self:custom.config.CACHE_INSTANCE_SIZE}
                NumCacheNodes: 1
                VpcSecurityGroupIds:
                    - 'Fn::GetAtt': [ServerlessStorageSecurityGroup, GroupId]
                CacheSubnetGroupName:
                    Ref: ServerlessCacheSubnetGroup
