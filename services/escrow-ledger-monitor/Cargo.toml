[package]
name = "escrow-ledger-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]
resolver = "3"

[dependencies]
escrow-enclave = { path = "../escrow-enclave-app", default-features = false }
lambda_runtime = "=0.14.4"
aws_lambda_events = { version = "=0.18.0", default-features = false, features = ["dynamodb"] }
aws-config = { version = "=1.8.18", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-dynamodb = { version = "=1.116.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-cloudwatch = { version = "=1.116.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-sns = { version = "=1.104.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-ssm = { version = "=1.113.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
async-trait = "0.1"
tokio = { version = "~1.53.1", features = ["macros", "rt-multi-thread"] }
serde_json = "~1.0.151"
serde_dynamo = "4"
p256 = { version = "~0.13.2", features = ["ecdsa"] }
hex = "~0.4.3"
thiserror = "~2.0.21"

[dev-dependencies]
escrow-enclave = { path = "../escrow-enclave-app", default-features = false, features = ["fake-ledger", "fake-time", "fake-kms", "fake-nsm"] }

[profile.release]
panic = "abort"
strip = true
lto = "thin"

[profile.dev]
debug = 0
