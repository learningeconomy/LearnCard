# Pair with compose.yaml. Keeps test data in a dedicated LC2201_QA_DIR;
# source/dependency mounts prevent stale local images from changing the tested code.
services:
    brain:
        # Ignore inherited service credentials/URLs: this walkthrough must stay local.
        environment:
            NEO4J_URI: bolt://neo4j:7687
            NEO4J_USERNAME: neo4j
            NEO4J_PASSWORD: this-is-the-password
            REDIS_HOST: redis
            REDIS_PORT: 6379
            AWS_ACCESS_KEY_ID: notARealKey
            AWS_SECRET_ACCESS_KEY: notARealSecretKey
            NOTIFICATIONS_QUEUE_POLL_URL: http://elasticmq:9324/notifications
            NOTIFICATIONS_QUEUE_URL: http://elasticmq:9324/notifications
            NOTIFICATIONS_SERVICE_PORT: 5200
    cloud:
        environment:
            LEARN_CLOUD_MONGO_URI: mongodb://mongodb:27017?ssl=false&replicaSet=rs0
            LEARN_CLOUD_MONGO_DB_NAME: learn-cloud
    neo4j:
        environment:
            NEO4J_AUTH: neo4j/this-is-the-password
        volumes:
            - ${LC2201_QA_DIR:?Set LC2201_QA_DIR first}/data/neo4j:/data
            - ${LC2201_QA_DIR:?Set LC2201_QA_DIR first}/data/neo4j-logs:/logs
    mongodb:
        volumes:
            - ${LC2201_QA_DIR:?Set LC2201_QA_DIR first}/data/mongo:/data/db
            - ${LC2201_QA_DIR:?Set LC2201_QA_DIR first}/data/mongo-config:/data/configdb
    postgres:
        volumes:
            - ${LC2201_QA_DIR:?Set LC2201_QA_DIR first}/data/postgres:/var/lib/postgresql
    lca-api:
        image: learncard-monorepo-local
        volumes:
            - ../../services/learn-card-network/lca-api/src:/app/services/learn-card-network/lca-api/src:ro
            - ../../packages/learn-card-types/src:/app/packages/learn-card-types/src:ro
            - ../../packages/learn-card-helpers/src:/app/packages/learn-card-helpers/src:ro
            - ../../packages/email-templates/src:/app/packages/email-templates/src:ro
            - ../../packages/sss-key-manager/src:/app/packages/sss-key-manager/src:ro
            - ../../node_modules:/app/node_modules:ro
        environment:
            SKIP_DIDKIT_NAPI: '1'
            MONGO_URI: mongodb://mongodb:27017?ssl=false&replicaSet=rs0
            MONGO_DB_NAME: lca-api-e2e
