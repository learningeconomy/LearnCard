# LC-2362 PoC track A. The CI binary is baked with --stage staging.
# demo@learningeconomy.io short-circuits in EmailForm.handleDemoLogin (no OTP).
appId: com.learncard.app
androidWebViewHierarchy: devtools
---
- launchApp:
      clearState: true
- extendedWaitUntil:
      visible: '(?i)sign in with email'
      timeout: 90000
- runFlow:
      when:
          visible:
              id: login-email
      commands:
          - tapOn:
                id: login-email
- runFlow:
      when:
          notVisible:
              id: login-email
      commands:
          - tapOn: 'Email address|Email'
- inputText: demo@learningeconomy.io
- tapOn: '(?i)sign in with email'
- extendedWaitUntil:
      visible: Passport
      timeout: 120000
- runFlow:
      when:
          platform: Android
      commands:
          - extendedWaitUntil:
                visible:
                    id: 'credential-card-.*'
                timeout: 30000
- runFlow:
      when:
          platform: iOS
      commands:
          - extendedWaitUntil:
                visible: 'Credential card'
                timeout: 30000
- takeScreenshot: wallet-loaded
