<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Unable to open the app</title>
        <style>
            body {
                margin: 0;
                padding: 32px 24px;
                background: #fff;
                color: #18224e;
                font:
                    16px/1.6 system-ui,
                    sans-serif;
            }
            main {
                max-width: 440px;
                margin: 15vh auto;
            }
            h1 {
                font-size: 24px;
                line-height: 1.3;
            }
            p {
                color: #6f7590;
            }
        </style>
    </head>
    <body>
        <main>
            <h1 id="title">Unable to open the app</h1>
            <p id="message">
                Update your browser and system software, check your connection, then reopen the app.
            </p>
        </main>
        <script>
            // Standalone fallback: the application and its locale runtime cannot load here.
            var messages = {
                en: [
                    'Unable to open the app',
                    'Update your browser and system software, check your connection, then reopen the app.',
                ],
                es: [
                    'No se puede abrir la aplicación',
                    'Actualiza el navegador y el sistema, comprueba tu conexión y vuelve a abrir la aplicación.',
                ],
                fr: [
                    'Impossible d’ouvrir l’application',
                    'Mettez à jour votre navigateur et votre système, vérifiez votre connexion, puis rouvrez l’application.',
                ],
                ar: [
                    'تعذّر فتح التطبيق',
                    'حدّث المتصفح ونظام الجهاز، وتحقّق من اتصالك، ثم أعد فتح التطبيق.',
                ],
            };
            var language = (navigator.language || 'en').split('-')[0];
            var locale = Object.prototype.hasOwnProperty.call(messages, language) ? language : 'en';
            document.documentElement.lang = locale;
            document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
            document.title = messages[locale][0];
            document.getElementById('title').textContent = messages[locale][0];
            document.getElementById('message').textContent = messages[locale][1];
        </script>
    </body>
</html>
