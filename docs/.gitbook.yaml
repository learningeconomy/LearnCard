# Redirect manifest for the docs migration (URL inventory: scripts/docs-migration-map.csv).
#
# LOCATION: this file MUST live in the directory GitBook Git Sync is mapped to (the
# "Project directory" in the space's Git Sync settings, shown as "GitBook (./docs)" in the
# PR check name). A .gitbook.yaml at the repository root is silently ignored.
#
# HOW GITBOOK URLS WORK (this is why the manifest is large):
#   A page's URL is <section-group-slug>/<parent-slug>/.../<page-slug>, derived from the
#   SUMMARY.md hierarchy — NOT from the file path. Renaming a "## Group" heading or
#   re-nesting a page changes its URL even when no file moves. The 2026 nav restructure
#   (8 type-based groups -> 5 journey-based groups) therefore moved every URL, so every
#   historical URL is redirected explicitly below. Do not rely on GitBook's implicit
#   "page moved" redirect: it is undocumented and does not cover section landing pages
#   (README.md) or OpenAPI-generated endpoint pages.
#
# Rules (per GitBook docs):
#   - Keys are URL paths relative to `root` (no leading slash); values are FILE paths
#     of published pages (must appear in SUMMARY.md).
#   - A redirect is ignored if a live page still exists at the key's URL.
#   - Never chain redirects: map every historical URL directly to its final destination.
# Verified in CI by scripts/check-docs-links.mjs, which computes URLs the same way GitBook
# does and fails if any URL in docs-migration-map.csv is neither live nor redirected.
