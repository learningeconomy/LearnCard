version: 2
updates:
    # One root job follows package.json workspaces and updates the shared bun.lock.
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 3
      groups:
          bun-patch-updates:
              patterns: ['*']
              update-types: ['patch']
    - package-ecosystem: docker
      directory: /infra/keycloak
      schedule:
          interval: weekly
      open-pull-requests-limit: 2
      groups:
          keycloak-images:
              patterns: ['*']
    - package-ecosystem: terraform
      directories:
          - /infra/aws/bootstrap
          - /infra/keycloak/terraform/network
          - /infra/keycloak/terraform/service
          # Kept ahead of the parallel realm workstream; see terraform/README.md.
          - /infra/keycloak/terraform/realm
      schedule:
          interval: weekly
      open-pull-requests-limit: 2
      groups:
          keycloak-terraform:
              patterns: ['*']
