name: Inspect DIDKit publisher for PR 1444

on:
    pull_request:
        branches:
            - main
        paths:
            - '.github/workflows/inspect-didkit-publisher-1444.yml'

permissions:
    actions: read
    contents: read

jobs:
    inspect:
        if: github.event.pull_request.number == 1444
        runs-on: ubuntu-latest
        steps:
            - name: Print recent DIDKit publisher runs
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const { data } = await github.rest.actions.listWorkflowRuns({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          workflow_id: 'update-didkit-wasm.yml',
                          event: 'workflow_dispatch',
                          per_page: 10,
                      });

                      for (const run of data.workflow_runs) {
                          console.log(JSON.stringify({
                              id: run.id,
                              run_number: run.run_number,
                              status: run.status,
                              conclusion: run.conclusion,
                              head_branch: run.head_branch,
                              head_sha: run.head_sha,
                              created_at: run.created_at,
                              updated_at: run.updated_at,
                          }));
                      }
