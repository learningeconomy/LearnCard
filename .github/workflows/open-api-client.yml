name: OpenAPI Python contracts

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - 'packages/open-api-lcn-clients/**'
            - '.github/workflows/open-api*.yml'
            - 'services/learn-card-network/brain-service/src/openapi.ts'
            - 'services/learn-card-network/brain-service/src/routes/**'
            - 'services/learn-card-network/brain-service/scripts/export-openapi.ts'
            - 'services/learn-card-network/brain-service/scripts/offline-schema-environment.ts'
            - 'services/learn-card-network/brain-service/scripts/verify-python-contracts.ts'
            - 'packages/learn-card-types/src/**'
    merge_group:
        types: [checks_requested]

permissions:
    contents: read

jobs:
    python-contracts:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout exact head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
                  persist-credentials: false
            - name: Setup pinned Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2
            - name: Setup pinned Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: 3.14.7
            - name: Install pinned dependencies without service initialization
              run: |
                  bun install --frozen-lockfile --ignore-scripts
                  python -m pip install --no-deps -r packages/open-api-lcn-clients/verification-requirements.txt
            - name: Export checked-out source without network or credentials
              run: |
                  docker run --rm --network none --user "$(id -u):$(id -g)" \
                    -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$RUNNER_TEMP:/artifacts" \
                    -w /workspace/services/learn-card-network/brain-service \
                    oven/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4 \
                    bun --conditions=development scripts/export-openapi.ts /artifacts/openapi.json
            - name: Exercise public APIs through loopback-only HTTP transport
              env:
                  OPENAPI_SCHEMA: ${{ runner.temp }}/openapi.json
                  CLIENT_CONTRACT_CAPTURE: ${{ runner.temp }}/client-capture.json
              run: python -m unittest discover -s packages/open-api-lcn-clients/tests -v
            - name: Validate prepared requests against actual source Zod contracts
              run: |
                  docker run --rm --network none --user "$(id -u):$(id -g)" \
                    -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$RUNNER_TEMP:/artifacts:ro" \
                    -w /workspace/services/learn-card-network/brain-service \
                    oven/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4 \
                    bun --conditions=development scripts/verify-python-contracts.ts /artifacts/client-capture.json
            - name: Verify all generated Python syntax and imports
              run: python packages/open-api-lcn-clients/tests/check_integrity.py
