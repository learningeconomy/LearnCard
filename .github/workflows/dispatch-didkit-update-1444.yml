name: Apply DIDKit publisher output to PR 1444

on:
    pull_request:
        branches:
            - main
        paths:
            - '.github/workflows/dispatch-didkit-update-1444.yml'

permissions:
    actions: write
    contents: write
    pull-requests: write

jobs:
    apply:
        if: github.event.pull_request.number == 1444
        runs-on: ubuntu-latest
        steps:
            - name: Publish from main and graft generated files onto PR 1444
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const targetBranch = context.payload.pull_request.head.ref;
                      const workflowId = 'update-didkit-wasm.yml';
                      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
                      const dispatchedAt = Date.now();

                      await github.rest.actions.createWorkflowDispatch({
                          owner,
                          repo,
                          workflow_id: workflowId,
                          ref: 'main',
                          inputs: {
                              didkit_ref: 'main',
                              ssi_ref: 'main',
                              force_rebuild: 'false',
                          },
                      });

                      let publishRun;
                      for (let attempt = 0; attempt < 120; attempt++) {
                          const { data } = await github.rest.actions.listWorkflowRuns({
                              owner,
                              repo,
                              workflow_id: workflowId,
                              branch: 'main',
                              event: 'workflow_dispatch',
                              per_page: 20,
                          });

                          publishRun = data.workflow_runs.find(run =>
                              new Date(run.created_at).getTime() >= dispatchedAt - 10000
                          );

                          if (publishRun?.status === 'completed') break;
                          await sleep(15000);
                      }

                      if (!publishRun) {
                          throw new Error('The main-branch DIDKit publisher run was not found.');
                      }

                      if (publishRun.status !== 'completed') {
                          throw new Error(`Publisher run ${publishRun.id} did not finish before the timeout.`);
                      }

                      if (publishRun.conclusion !== 'success') {
                          throw new Error(`Publisher run ${publishRun.id} finished with ${publishRun.conclusion}.`);
                      }

                      let updatePr;
                      for (let attempt = 0; attempt < 30; attempt++) {
                          const { data: prs } = await github.rest.pulls.list({
                              owner,
                              repo,
                              state: 'open',
                              head: `${owner}:automation/update-didkit-wasm`,
                              base: 'main',
                              per_page: 10,
                          });

                          updatePr = prs[0];
                          if (updatePr) break;
                          await sleep(10000);
                      }

                      if (!updatePr) {
                          throw new Error('The publisher succeeded but did not open its generated update PR.');
                      }

                      const files = await github.paginate(github.rest.pulls.listFiles, {
                          owner,
                          repo,
                          pull_number: updatePr.number,
                          per_page: 100,
                      });

                      const exactAllowed = new Set([
                          '.changeset/update-didkit-wasm.md',
                          'lib/didkit',
                          'lib/ssi',
                          'packages/plugins/didkit/wasm/didkit-wasm.Cargo.lock',
                          'packages/plugins/didkit/src/didkit/index.ts',
                      ]);
                      const isAllowed = path =>
                          exactAllowed.has(path) ||
                          path.startsWith('packages/plugins/didkit/src/didkit/pkg/');

                      const unexpected = files.filter(file => !isAllowed(file.filename));
                      if (unexpected.length > 0) {
                          throw new Error(`Generated PR contains unexpected files: ${unexpected.map(file => file.filename).join(', ')}`);
                      }

                      const copyFiles = files.filter(
                          file => file.filename !== '.changeset/update-didkit-wasm.md'
                      );

                      const { data: generatedCommit } = await github.rest.git.getCommit({
                          owner,
                          repo,
                          commit_sha: updatePr.head.sha,
                      });
                      const { data: generatedTree } = await github.rest.git.getTree({
                          owner,
                          repo,
                          tree_sha: generatedCommit.tree.sha,
                          recursive: 'true',
                      });
                      const generatedEntries = new Map(
                          generatedTree.tree.map(entry => [entry.path, entry])
                      );

                      const tree = copyFiles.map(file => {
                          if (file.status === 'removed') {
                              return { path: file.filename, sha: null };
                          }

                          if (file.status === 'renamed') {
                              throw new Error(`Unexpected renamed generated file: ${file.filename}`);
                          }

                          const entry = generatedEntries.get(file.filename);
                          if (!entry?.sha || !entry.mode || !entry.type) {
                              throw new Error(`Could not resolve generated tree entry for ${file.filename}`);
                          }

                          return {
                              path: file.filename,
                              mode: entry.mode,
                              type: entry.type,
                              sha: entry.sha,
                          };
                      });

                      const { data: targetRef } = await github.rest.git.getRef({
                          owner,
                          repo,
                          ref: `heads/${targetBranch}`,
                      });
                      const targetHead = targetRef.object.sha;
                      const { data: targetCommit } = await github.rest.git.getCommit({
                          owner,
                          repo,
                          commit_sha: targetHead,
                      });
                      const { data: newTree } = await github.rest.git.createTree({
                          owner,
                          repo,
                          base_tree: targetCommit.tree.sha,
                          tree,
                      });
                      const { data: newCommit } = await github.rest.git.createCommit({
                          owner,
                          repo,
                          message: 'chore: update didkit wasm from merged SSI',
                          tree: newTree.sha,
                          parents: [targetHead],
                      });

                      await github.rest.git.updateRef({
                          owner,
                          repo,
                          ref: `heads/${targetBranch}`,
                          sha: newCommit.sha,
                      });

                      await github.rest.pulls.update({
                          owner,
                          repo,
                          pull_number: updatePr.number,
                          state: 'closed',
                      });

                      try {
                          await github.rest.git.deleteRef({
                              owner,
                              repo,
                              ref: 'heads/automation/update-didkit-wasm',
                          });
                      } catch (error) {
                          core.warning(`Generated branch cleanup failed: ${error.message}`);
                      }

                      core.notice(`Applied publisher run ${publishRun.id} via generated PR #${updatePr.number} to ${targetBranch} at ${newCommit.sha}.`);
