name: Finish DIDKit update for PR 1444

on:
    pull_request:
        branches:
            - main
        paths:
            - '.github/workflows/dispatch-didkit-update-1444.yml'

permissions:
    actions: read
    contents: write
    pull-requests: write

jobs:
    finish:
        if: github.event.pull_request.number == 1444
        runs-on: ubuntu-latest
        steps:
            - name: Wait for publisher and merge its update into PR 1444
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const branch = context.payload.pull_request.head.ref;
                      const workflowId = 'update-didkit-wasm.yml';
                      const cutoff = Date.now() - 20 * 60 * 1000;
                      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

                      let run;
                      for (let attempt = 0; attempt < 80; attempt++) {
                          const { data } = await github.rest.actions.listWorkflowRuns({
                              owner,
                              repo,
                              workflow_id: workflowId,
                              branch,
                              event: 'workflow_dispatch',
                              per_page: 20,
                          });

                          run = data.workflow_runs.find(candidate =>
                              new Date(candidate.created_at).getTime() >= cutoff
                          );

                          if (run?.status === 'completed') break;
                          await sleep(15000);
                      }

                      if (!run) {
                          throw new Error(`No recent workflow_dispatch run found for ${workflowId} on ${branch}`);
                      }

                      if (run.status !== 'completed') {
                          throw new Error(`Publisher run ${run.id} did not finish before the timeout`);
                      }

                      if (run.conclusion !== 'success') {
                          throw new Error(`Publisher run ${run.id} finished with ${run.conclusion}`);
                      }

                      let updatePr;
                      for (let attempt = 0; attempt < 20; attempt++) {
                          const { data: prs } = await github.rest.pulls.list({
                              owner,
                              repo,
                              state: 'open',
                              head: `${owner}:automation/update-didkit-wasm`,
                              base: branch,
                              per_page: 10,
                          });

                          updatePr = prs[0];
                          if (updatePr) break;
                          await sleep(10000);
                      }

                      if (!updatePr) {
                          throw new Error(`Publisher succeeded but no update PR targets ${branch}`);
                      }

                      const { data: merge } = await github.rest.pulls.merge({
                          owner,
                          repo,
                          pull_number: updatePr.number,
                          merge_method: 'squash',
                          commit_title: 'chore: update didkit wasm',
                          commit_message: `Generated by ${workflowId} run ${run.id} for PR #1444.`,
                      });

                      if (!merge.merged) {
                          throw new Error(`Could not merge generated PR #${updatePr.number}: ${merge.message}`);
                      }

                      core.notice(`Merged generated PR #${updatePr.number} into ${branch}`);
