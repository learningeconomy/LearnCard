name: Apply generated DIDKit WASM to PR 1444

on:
    pull_request:
        branches:
            - main
        paths:
            - '.github/workflows/dispatch-didkit-update-1444.yml'

permissions:
    contents: write
    pull-requests: write

jobs:
    apply:
        if: github.event.pull_request.number == 1444
        runs-on: ubuntu-latest
        steps:
            - name: Graft generated PR 1455 onto PR 1444 and clean up helpers
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const targetBranch = context.payload.pull_request.head.ref;
                      const generatedPrNumber = 1455;

                      const { data: generatedPr } = await github.rest.pulls.get({
                          owner,
                          repo,
                          pull_number: generatedPrNumber,
                      });

                      if (generatedPr.state !== 'open') {
                          throw new Error(`Generated PR #${generatedPrNumber} is ${generatedPr.state}, expected open.`);
                      }
                      if (generatedPr.base.ref !== 'main') {
                          throw new Error(`Generated PR #${generatedPrNumber} targets ${generatedPr.base.ref}, expected main.`);
                      }
                      if (generatedPr.head.ref !== 'automation/update-didkit-wasm') {
                          throw new Error(`Unexpected generated branch: ${generatedPr.head.ref}`);
                      }

                      const files = await github.paginate(github.rest.pulls.listFiles, {
                          owner,
                          repo,
                          pull_number: generatedPrNumber,
                          per_page: 100,
                      });

                      const exactAllowed = new Set([
                          '.changeset/update-didkit-wasm.md',
                          'lib/didkit',
                          'lib/ssi',
                          'packages/plugins/didkit/wasm/didkit-wasm.Cargo.lock',
                          'packages/plugins/didkit/src/didkit/index.ts',
                      ]);
                      const isAllowed = path =>
                          exactAllowed.has(path) ||
                          path.startsWith('packages/plugins/didkit/src/didkit/pkg/');

                      const unexpected = files.filter(file => !isAllowed(file.filename));
                      if (unexpected.length > 0) {
                          throw new Error(`Generated PR contains unexpected files: ${unexpected.map(file => file.filename).join(', ')}`);
                      }

                      const { data: generatedCommit } = await github.rest.git.getCommit({
                          owner,
                          repo,
                          commit_sha: generatedPr.head.sha,
                      });
                      const { data: generatedTree } = await github.rest.git.getTree({
                          owner,
                          repo,
                          tree_sha: generatedCommit.tree.sha,
                          recursive: 'true',
                      });
                      const generatedEntries = new Map(
                          generatedTree.tree.map(entry => [entry.path, entry])
                      );

                      const copyFiles = files.filter(
                          file => file.filename !== '.changeset/update-didkit-wasm.md'
                      );
                      const tree = copyFiles.map(file => {
                          if (file.status === 'removed') {
                              return {
                                  path: file.filename,
                                  mode: '100644',
                                  type: 'blob',
                                  sha: null,
                              };
                          }
                          if (file.status === 'renamed') {
                              throw new Error(`Unexpected renamed generated file: ${file.filename}`);
                          }

                          const entry = generatedEntries.get(file.filename);
                          if (!entry?.sha || !entry.mode || !entry.type) {
                              throw new Error(`Could not resolve generated tree entry for ${file.filename}`);
                          }

                          return {
                              path: file.filename,
                              mode: entry.mode,
                              type: entry.type,
                              sha: entry.sha,
                          };
                      });

                      for (const path of [
                          '.github/workflows/dispatch-didkit-update-1444.yml',
                          '.github/workflows/inspect-didkit-publisher-1444.yml',
                          '.github/workflows/cancel-duplicate-didkit-1444.yml',
                      ]) {
                          tree.push({ path, mode: '100644', type: 'blob', sha: null });
                      }

                      const { data: targetRef } = await github.rest.git.getRef({
                          owner,
                          repo,
                          ref: `heads/${targetBranch}`,
                      });
                      const targetHead = targetRef.object.sha;
                      const { data: targetCommit } = await github.rest.git.getCommit({
                          owner,
                          repo,
                          commit_sha: targetHead,
                      });
                      const { data: newTree } = await github.rest.git.createTree({
                          owner,
                          repo,
                          base_tree: targetCommit.tree.sha,
                          tree,
                      });
                      const { data: newCommit } = await github.rest.git.createCommit({
                          owner,
                          repo,
                          message: 'chore: update didkit wasm from SSI #5',
                          tree: newTree.sha,
                          parents: [targetHead],
                      });

                      await github.rest.git.updateRef({
                          owner,
                          repo,
                          ref: `heads/${targetBranch}`,
                          sha: newCommit.sha,
                      });

                      await github.rest.pulls.update({
                          owner,
                          repo,
                          pull_number: generatedPrNumber,
                          state: 'closed',
                      });

                      try {
                          await github.rest.git.deleteRef({
                              owner,
                              repo,
                              ref: 'heads/automation/update-didkit-wasm',
                          });
                      } catch (error) {
                          core.warning(`Generated branch cleanup failed: ${error.message}`);
                      }

                      core.notice(`Applied generated PR #${generatedPrNumber} to ${targetBranch} at ${newCommit.sha}.`);
