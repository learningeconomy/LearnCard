name: Dispatch DIDKit update to PR 1444

on:
    pull_request:
        branches:
            - main
        paths:
            - '.github/workflows/dispatch-didkit-update-1444.yml'

permissions:
    actions: write
    contents: read

jobs:
    dispatch:
        if: github.event.pull_request.number == 1444
        runs-on: ubuntu-latest
        steps:
            - name: Dispatch existing DIDKit publisher on the PR branch
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      await github.rest.actions.createWorkflowDispatch({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          workflow_id: 'update-didkit-wasm.yml',
                          ref: context.payload.pull_request.head.ref,
                          inputs: {
                              didkit_ref: 'main',
                              ssi_ref: 'main',
                              force_rebuild: 'false',
                          },
                      });
