name: Test AI Agent

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: test-ai-agent-${{ github.event.pull_request.number }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    validate:
        name: AI Agent CI
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            CI: true
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use composite setup action
              uses: ./.github/actions/setup

            - name: Run AI Agent tests
              run: bun run --cwd services/learn-card-network/ai-agent test -- run

            - name: Build AI Agent
              run: bun run --cwd services/learn-card-network/ai-agent build

            - name: Lint CloudFormation template
              run: pipx run cfn-lint services/learn-card-network/ai-agent/infra/aws/template.yml
