name: AI Passport

# Service-backed checks for services/ai-passport-backend, carried over
# from the AI-Passport repo's CI. The backend suite needs Mongo (replica set), Redis, Qdrant
# and the local privacy runtime, so it is not wired to the nx `test` target.
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - 'services/ai-passport-backend/**'
            - 'packages/learn-card-mcp/**'
            - 'packages/learn-card-types/src/aiPassport.ts'
            - 'bun.lock'
            - '.github/workflows/ai-passport.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ai-passport-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend unit and privacy runtime
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            JWT_SECRET: ci-test-secret-key
            MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
            MONGO_DB: consent_flow_chat
            REDIS_HOST: localhost
            REDIS_PORT: 6379
            QDRANT_HOST: localhost
            QDRANT_PORT: 6333
            AI_PRIVACY_PYTHON: /opt/ai-privacy/bin/python
            AWS_REGION: us-east-1
            AI_PRIVACY_ASSET_DIR: /opt/ai-privacy/assets
        services:
            redis:
                image: redis:alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            qdrant:
                image: qdrant/qdrant:v1.17.0
                ports:
                    - 6333:6333
                    - 6334:6334
                options: >-
                    --health-cmd "timeout 5 bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            # The backend's scripts and tests resolve workspace @learncard/* source through
            # `--conditions=development`; these dists cover anything loaded with default resolution.
            - name: Build linked LearnCard libraries
              run: bunx nx run-many -t build --projects=core,didkit-plugin,helpers,types,vc-plugin

            - name: Start transactional MongoDB
              run: |
                  docker run -d --name mongo-ci -p 127.0.0.1:27017:27017 mongo:6 --replSet rs0 --bind_ip_all
                  timeout 60 bash -c 'until docker exec mongo-ci mongosh --quiet --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"; do sleep 1; done'
                  docker exec mongo-ci mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
                  timeout 60 bash -c 'until docker exec mongo-ci mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 1; done'

            # The OCR packages come from the runner's apt mirror list, which tries the Azure mirror
            # first. When that mirror stops answering, apt waits ~20s on it for every index and
            # package and this step times out (run 43052496216). A cache hit installs the exact
            # .debs offline; a miss tries the canonical archive first, with short timeouts and retries.
            - name: Restore OCR package cache
              id: ocr-debs
              uses: actions/cache/restore@v6
              with:
                  path: ~/.cache/ai-passport-ocr-debs
                  key: ai-passport-ocr-debs-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('services/ai-passport-backend/privacy/install.sh') }}

            - name: Install cached OCR packages
              if: steps.ocr-debs.outputs.cache-hit == 'true'
              run: |
                  sudo dpkg -i ~/.cache/ai-passport-ocr-debs/*.deb
                  echo "AI_PRIVACY_SKIP_APT=1" >> "$GITHUB_ENV"

            - name: Prefer canonical Ubuntu mirrors
              if: steps.ocr-debs.outputs.cache-hit != 'true'
              run: |
                  # ubuntu.sources points at `mirror+file:/etc/apt/apt-mirrors.txt`; move Azure to the end.
                  list=/etc/apt/apt-mirrors.txt
                  { grep -v azure "$list" || true; grep azure "$list" || true; } > "$RUNNER_TEMP/apt-mirrors.txt"
                  sudo cp "$RUNNER_TEMP/apt-mirrors.txt" "$list"
                  cat "$list"
                  printf '%s\n' \
                      'Acquire::Retries "3";' \
                      'Acquire::http::Timeout "15";' \
                      'Acquire::https::Timeout "15";' \
                      'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99ci-network
                  sudo rm -f /var/cache/apt/archives/*.deb

            - name: Provision local extraction runtime
              timeout-minutes: 10
              run: |
                  AI_PRIVACY_KEY="$(openssl rand -base64 32)"
                  echo "::add-mask::$AI_PRIVACY_KEY"
                  echo "AI_PRIVACY_KEY=$AI_PRIVACY_KEY" >> "$GITHUB_ENV"
                  sudo AI_PRIVACY_SKIP_APT="${AI_PRIVACY_SKIP_APT:-0}" sh services/ai-passport-backend/privacy/install.sh services/ai-passport-backend/privacy
                  sudo cp services/ai-passport-backend/privacy/processor.py /opt/ai-privacy/assets/processor.py

            - name: Save OCR package cache
              if: steps.ocr-debs.outputs.cache-hit != 'true'
              run: |
                  mkdir -p ~/.cache/ai-passport-ocr-debs
                  cp /var/cache/apt/archives/*.deb ~/.cache/ai-passport-ocr-debs/
                  ls -1 ~/.cache/ai-passport-ocr-debs

            - if: steps.ocr-debs.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: ~/.cache/ai-passport-ocr-debs
                  key: ${{ steps.ocr-debs.outputs.cache-primary-key }}

            - name: Run backend unit tests
              working-directory: services/ai-passport-backend
              env:
                  CI: true
              run: bun run test:unit

            - name: Verify local OCR and document extraction
              working-directory: services/ai-passport-backend
              run: bun run test:privacy-runtime

            - name: Build backend
              working-directory: services/ai-passport-backend
              run: bun run build
