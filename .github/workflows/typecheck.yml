name: Typecheck

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    merge_group:
        types: [checks_requested]

concurrency:
    group: typecheck-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

jobs:
    typecheck-ratchet:
        # Probe only: the full job already ran at fa6a2ff85 (run 40411451832).
        if: ${{ false }}
        name: Typecheck ratchet
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            - name: Test the ratchet script
              run: node --test scripts/typecheck-ratchet.test.mjs scripts/typecheck-diagnostics.test.mjs

            # tsc resolves Node-resolution services against built dist, so every library is built
            # first. scripts/typecheck-baseline.json is generated in this same state.
            - name: Build libraries
              run: bunx nx run-many -t build --projects="$(bunx nx show projects --type lib --with-target build | paste -sd, -)"

            # Paraglide output is gitignored; generate it so app typechecks see real message types.
            - name: Compile Paraglide messages
              run: |
                  bun run --cwd apps/learn-card-app i18n:compile
                  bun run --cwd apps/scouts i18n:generate

            # Fails when any project's tsc error count rises above scripts/typecheck-baseline.json.
            # Lower the baseline with `bun run typecheck:baseline` after fixing errors.
            - name: Run typecheck ratchet
              id: ratchet
              continue-on-error: true
              run: node scripts/typecheck-ratchet.mjs --report="$RUNNER_TEMP/typecheck-head.json"

            # A count failure is retained. Only then prepare the PR base independently,
            # and recheck the projects above allowance to explain which diagnostics differ.
            - name: Select projects for base comparison
              id: comparison
              if: ${{ steps.ratchet.outcome == 'failure' && github.event_name == 'pull_request' }}
              run: node scripts/typecheck-diagnostics.mjs select "$RUNNER_TEMP/typecheck-head.json"

            # Keep the base outside the head workspace: TypeScript searches ancestor
            # node_modules/@types directories even when the base has its own install.
            - name: Checkout PR base outside the workspace
              if: ${{ steps.comparison.outputs.needed == 'true' }}
              env:
                  TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  git fetch --no-tags --depth=1 origin "$TYPECHECK_BASE_SHA"
                  git worktree add --detach "$RUNNER_TEMP/typecheck-base" FETCH_HEAD

            - name: Prepare base dependencies and libraries
              if: ${{ steps.comparison.outputs.needed == 'true' }}
              working-directory: ${{ runner.temp }}/typecheck-base
              run: |
                  bun install --frozen-lockfile
                  bunx nx run-many -t build --projects="$(bunx nx show projects --type lib --with-target build | paste -sd, -)"
                  bun run --cwd apps/learn-card-app i18n:compile
                  bun run --cwd apps/scouts i18n:generate

            - name: Check affected projects at base
              if: ${{ steps.comparison.outputs.needed == 'true' }}
              run: node scripts/typecheck-diagnostics.mjs base "$RUNNER_TEMP/typecheck-head.json" "$RUNNER_TEMP/typecheck-base" "$RUNNER_TEMP/typecheck-base.json"

            - name: Explain ratchet failure
              if: ${{ always() && steps.ratchet.outcome == 'failure' }}
              run: node scripts/typecheck-diagnostics.mjs render "$RUNNER_TEMP/typecheck-head.json" "$RUNNER_TEMP/typecheck-base.json"

            # Probe only: exercise the unavailable-base renderer as well as the real comparison.
            - name: Probe current diagnostics when the base report is missing
              if: ${{ always() && steps.ratchet.outcome == 'failure' }}
              run: |
                  node scripts/typecheck-diagnostics.mjs render "$RUNNER_TEMP/typecheck-head.json" "$RUNNER_TEMP/intentionally-missing-base.json" | tee "$RUNNER_TEMP/typecheck-fallback.txt"
                  node -e "const text = require('node:fs').readFileSync(process.argv[1], 'utf8'); const assert = require('node:assert/strict'); assert.match(text, /Current head diagnostic sample/); assert.match(text, /title=Current TS/); assert.doesNotMatch(text, /title=Added|[0-9]+ added diagnostic/);" "$RUNNER_TEMP/typecheck-fallback.txt"

            - name: Retain diagnostic reports
              if: ${{ always() }}
              continue-on-error: true
              uses: actions/upload-artifact@v7
              with:
                  name: typecheck-diagnostics
                  path: |
                      ${{ runner.temp }}/typecheck-head.json
                      ${{ runner.temp }}/typecheck-base.json
                  if-no-files-found: ignore
                  retention-days: 7

            # continue-on-error permits explanation, not a passing count gate.
            - name: Enforce ratchet result
              if: ${{ always() && steps.ratchet.outcome != 'success' }}
              run: |
                  echo "The typecheck ratchet did not pass. See the diagnostic comparison above."
                  exit 1

    fallback-from-reports:
        name: Validate fallback from the completed failure probe
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Read retained reports and assert both rendering paths
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download 40411451832 --name typecheck-diagnostics --dir "$RUNNER_TEMP/probe-reports"
                  node --input-type=module <<'JS'
                  import assert from 'node:assert/strict';
                  import { readFileSync } from 'node:fs';
                  import { spawnSync } from 'node:child_process';
                  const directory = process.env.RUNNER_TEMP + '/probe-reports';
                  const head = JSON.parse(readFileSync(directory + '/typecheck-head.json'));
                  const base = JSON.parse(readFileSync(directory + '/typecheck-base.json'));
                  const current = head.results.find(result => result.name === 'learn-card-app');
                  const previous = base.results.find(result => result.name === 'learn-card-app');
                  assert.equal(current.count, 1968);
                  assert.equal(previous.count, 1967);
                  for (const [label, report] of [['compared', directory + '/typecheck-base.json'], ['unavailable', directory + '/absent.json']]) {
                      const ran = spawnSync(process.execPath, ['scripts/typecheck-diagnostics.mjs', 'render', directory + '/typecheck-head.json', report], { encoding: 'utf8' });
                      assert.equal(ran.status, 0, ran.stderr);
                      if (label === 'compared') {
                          assert.match(ran.stdout, /1 added diagnostic\(s\)/);
                          assert.match(ran.stdout, /typecheck-hosted-probe.ts:2:14/);
                          assert.equal((ran.stdout.match(/::error /g) ?? []).length, 1);
                      } else {
                          assert.match(ran.stdout, /Comparison unavailable/);
                          assert.match(ran.stdout, /Current head diagnostic sample/);
                          assert.match(ran.stdout, /Showing 30 of 1968/);
                          assert.equal((ran.stdout.match(/title=Current TS/g) ?? []).length, 30);
                          assert.doesNotMatch(ran.stdout, /title=Added|[0-9]+ added diagnostic/);
                      }
                      console.log(ran.stdout);
                  }
                  assert.match(readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8'), /Current head diagnostic sample/);
                  console.log('Both rendering paths verified against the actual hosted reports.');
                  JS
