name: Integration cache benchmark

# Two same-commit comparisons of the existing warm package archive versus a
# fresh runner-local install. Both layouts run all six suite commands.
on:
    pull_request:
        types: [labeled]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    first:
        if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark-integration-cache'
        name: First (${{ matrix.cache && 'cached' || 'uncached' }}, ${{ matrix.group }})
        strategy:
            fail-fast: false
            matrix:
                group: [graph, delivery]
                cache: [true, false]
        uses: ./.github/workflows/brain-integration.yml
        with:
            group: ${{ matrix.group }}
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
            dependency_cache: ${{ matrix.cache }}
        secrets:
            DOCKERHUB_PULL_USERNAME: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
            DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

    repeat:
        needs: first
        name: Repeat (${{ matrix.cache && 'cached' || 'uncached' }}, ${{ matrix.group }})
        strategy:
            fail-fast: false
            matrix:
                group: [graph, delivery]
                cache: [true, false]
        uses: ./.github/workflows/brain-integration.yml
        with:
            group: ${{ matrix.group }}
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
            dependency_cache: ${{ matrix.cache }}
        secrets:
            DOCKERHUB_PULL_USERNAME: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
            DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
