name: Docs Link Integrity

on:
    pull_request:
        paths:
            - 'docs/**'
            - 'docs/.gitbook.yaml'
            - 'scripts/check-docs-links.mjs'
            - 'scripts/check-docs-snippets.mjs'
            - 'scripts/docs-links-allowlist.json'
            - '.github/workflows/docs-links.yml'
    push:
        branches:
            - main
        paths:
            - 'docs/**'
            - 'docs/.gitbook.yaml'
            - 'scripts/check-docs-links.mjs'
            - 'scripts/check-docs-snippets.mjs'
            - 'scripts/docs-links-allowlist.json'
            - '.github/workflows/docs-links.yml'

permissions:
    contents: read

jobs:
    check-links:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: node scripts/check-docs-links.mjs
            - run: node scripts/check-docs-snippets.mjs
