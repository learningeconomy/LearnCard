# Temporary CI-15 timing harness; do not merge this branch.
name: Seed isolated E2E SDK benchmark

on:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: shared-e2e-sdk-${{ github.ref }}
    cancel-in-progress: false

jobs:
    sdk:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - uses: ./.github/actions/setup

            - name: Calculate fixed SDK identity
              id: key
              run: |
                  spec="$RUNNER_TEMP/sdk-producer-spec.json"
                  key=$(node scripts/e2e-hosted/sdk-build-cache.mjs key "$spec")
                  [[ "$key" =~ ^e2e-sdk-shared-v1-[a-f0-9]{64}$ ]]
                  echo "SDK input identity: $key"
                  echo "key=$key" >> "$GITHUB_OUTPUT"

            - name: Look up the isolated benchmark identity
              id: lookup
              if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/lc-2312-sdk-cache-benchmark' }}
              uses: actions/cache/restore@v6
              with:
                  path: ${{ runner.temp }}/e2e-sdk-snapshot
                  key: ci15-benchmark-${{ steps.key.outputs.key }}
                  lookup-only: true

            - name: Build SDK prerequisites with their canonical CI environment
              if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
              run: node scripts/e2e-hosted/sdk-build-cache.mjs build "$RUNNER_TEMP/sdk-producer-spec.json" unused producer

            - name: Snapshot successful SDK builds
              if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
              run: node scripts/e2e-hosted/sdk-build-cache.mjs snapshot "$RUNNER_TEMP/sdk-producer-spec.json" "$RUNNER_TEMP/e2e-sdk-snapshot"

            # Benchmark-only writer: explicit manual event + exact scratch branch.
            # Its key prefix and branch scope cannot replace a main snapshot.
            - name: Seed the isolated manual benchmark cache
              if: ${{ success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/lc-2312-sdk-cache-benchmark' && steps.lookup.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@v6
              with:
                  path: ${{ runner.temp }}/e2e-sdk-snapshot
                  key: ci15-benchmark-${{ steps.key.outputs.key }}

            - name: Explain publication scope
              if: always()
              env:
                  PUBLISHABLE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/lc-2312-sdk-cache-benchmark' }}
              run: |
                  echo "### SDK benchmark seed: publication eligible=$PUBLISHABLE" >> "$GITHUB_STEP_SUMMARY"
                  echo 'Benchmark namespace only. No test success, SPA or Nx database is published.' >> "$GITHUB_STEP_SUMMARY"
