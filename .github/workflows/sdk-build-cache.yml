name: Prepare shared E2E SDK builds

on:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: shared-e2e-sdk-${{ github.ref }}
    cancel-in-progress: false

jobs:
    sdk:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: 2aeb0c12862b6ff616c91a343c1d8c4c1d890ee5
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - uses: ./.github/actions/setup

            - name: Calculate fixed SDK identity
              id: key
              run: |
                  spec="$RUNNER_TEMP/sdk-producer-spec.json"
                  key=$(node scripts/e2e-hosted/sdk-build-cache.mjs key "$spec")
                  [[ "$key" =~ ^e2e-sdk-shared-v1-[a-f0-9]{64}$ ]]
                  echo "SDK input identity: $key"
                  echo "key=$key" >> "$GITHUB_OUTPUT"

            - name: Check whether main already published this identity
              id: lookup
              if: ${{ github.ref == 'refs/heads/main' }}
              uses: actions/cache/restore@v6
              with:
                  path: ${{ runner.temp }}/e2e-sdk-snapshot
                  key: ${{ steps.key.outputs.key }}
                  lookup-only: true

            - name: Build SDK prerequisites with their canonical CI environment
              if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
              run: node scripts/e2e-hosted/sdk-build-cache.mjs build "$RUNNER_TEMP/sdk-producer-spec.json" unused producer

            - name: Snapshot successful SDK builds
              if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
              run: node scripts/e2e-hosted/sdk-build-cache.mjs snapshot "$RUNNER_TEMP/sdk-producer-spec.json" "$RUNNER_TEMP/e2e-sdk-snapshot"

            - name: Restore the producer snapshot after consumer-only edits
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = 2aeb0c12862b6ff616c91a343c1d8c4c1d890ee5
                  script=scripts/e2e-hosted/sdk-build-cache.mjs
                  spec="$RUNNER_TEMP/sdk-producer-spec.json"
                  next="$RUNNER_TEMP/sdk-consumer-spec.json"
                  cache="$RUNNER_TEMP/e2e-sdk-snapshot"
                  original=$(node -p 'require(process.argv[1]).key' "$spec")
                  echo >> packages/learn-card-base/src/index.ts
                  test "$(node "$script" key "$next")" = "$original"
                  echo >> packages/learn-card-registries/trusted/registry.json
                  test "$(node "$script" key "$next")" = "$original"
                  node --input-type=module - "$next" <<'JS'
                  import fs from 'node:fs';
                  import {safeOutput} from './scripts/e2e-hosted/sdk-build-cache.mjs';
                  for (const root of JSON.parse(fs.readFileSync(process.argv[2])).roots) {
                      fs.rmSync(safeOutput(root), {recursive:true});
                  }
                  JS
                  node "$script" restore "$next" "$cache"
                  node --input-type=module - "$spec" "$cache" <<'JS'
                  import assert from 'node:assert/strict';
                  import fs from 'node:fs';
                  import {inventory} from './scripts/e2e-hosted/sdk-build-cache.mjs';
                  const roots=JSON.parse(fs.readFileSync(process.argv[2])).roots;
                  for (const root of roots) assert.deepEqual(inventory(root), inventory(process.argv[3] + '/payload/' + root));
                  console.log(roots.length + ' restored roots match producer bytes and modes');
                  JS
                  echo >> packages/learn-card-types/package.json
                  test "$(node "$script" key "$next")" != "$original"

            # Feature-branch dispatches exercise the producer without publishing.
            # Only main can make a shared snapshot; no PR consumer writes one.
            - name: Publish from trusted main only
              if: ${{ success() && github.ref == 'refs/heads/main' && steps.lookup.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@v6
              with:
                  path: ${{ runner.temp }}/e2e-sdk-snapshot
                  key: ${{ steps.key.outputs.key }}

            - name: Explain publication scope
              if: always()
              env:
                  PUBLISHABLE: ${{ github.ref == 'refs/heads/main' }}
              run: |
                  echo "### Shared SDK producer: main publication eligible=$PUBLISHABLE" >> "$GITHUB_STEP_SUMMARY"
                  echo 'Only compiled SDK prerequisites are shared. No test success, SPA or Nx database is published.' >> "$GITHUB_STEP_SUMMARY"
