name: Global Main Branch Failure Notification

on:
    workflow_run:
        # Filter the SOURCE run's branch before creating a notification run.
        branches: [main]
        # Keep main-capable workflows (including manual/scheduled automation),
        # excluding PR/merge-queue-only and reusable-only workflows. Reusable
        # failures propagate to their caller. Never subscribe to this notifier.
        # test-failure-notification.test.cjs catches additions and renames.
        workflows:
            - AI Passport
            - Auth Integration (Keycloak)
            - CapGo PR Preview
            - CapGo SSS Pilot
            - CapGo Staging Deploy
            - Chromatic
            - Claude PR Assistant
            - CodeQL full comparison
            - CodeQL
            - Deploy
            - DIDKit Plugin Node Prebuilds
            - Docs Link Integrity
            - E2E
            - E2E cache warm
            - Escrow Enclave EIF
            - Escrow Host/Monitor Audit
            - fastlane-deploy-native-apps
            - fastlane-upload-to-appetize
            - Firebase logout storage
            - gitStream workflow automation
            - Keycloak Drift Check
            - Keycloak Infrastructure
            - Keycloak Apple provider watch
            - LearnCard MCP
            - Maid-Service
            - Migrate Signing Authority Seeds
            - Mock E2E
            - Nx main artifact producer
            - OpenID4VC Interop Tests
            - PR Review Reminder
            - Full-Stack PR Preview
            - Publish verification proof
            - Publish to App Stores
            - Prepare shared E2E SDK builds
            - Recover LearnCard Production Frontend (CapGo Version)
            - Smoketest Published NPM Packages
            - Smoketest
            - Service Health Check
            - Tailwind visual regression
            - Test Runner
            - Integration build-once benchmark
            - Integration runner benchmark
            - Update DIDKit WASM
            - Validate Published Package Contracts
            - LearnCard Verification
            - Validate GitHub workflows
        types:
            - completed # Trigger when they complete

permissions:
    contents: read

jobs:
    notify_on_failure:
        runs-on: ubuntu-latest
        # Only run on main branch actions that fail:
        if: >-
            (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
            github.event.workflow_run.head_branch == 'main'
        steps:
            - name: Slack Notification
              uses: rtCamp/action-slack-notify@v2
              env:
                  SLACK_USERNAME: GitHub Actions CI
                  SLACK_TITLE: 'Main Branch Workflow Failed: ${{ github.event.workflow_run.name }}'
                  SLACK_MESSAGE: |
                      Workflow *${{ github.event.workflow_run.name }}* (run #${{ github.event.workflow_run.run_number }}) on branch `main` concluded with *${{ github.event.workflow_run.conclusion }}*.
                      Triggering event: `${{ github.event.workflow_run.event }}`
                      Head branch: `${{ github.event.workflow_run.head_branch }}`
                      Commit: `${{ github.event.workflow_run.head_commit.message }}` (`${{ github.event.workflow_run.head_sha }}`) by `${{ github.event.sender.login }}`
                      Actor: `${{ github.event.workflow_run.actor.login }}`
                      Check the run: ${{ github.event.workflow_run.html_url }}
                  SLACK_COLOR: 'danger'
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOY_ERRORS_URL }} # Ensure this secret is set in your repository
                  MSG_MINIMAL: 'true'
