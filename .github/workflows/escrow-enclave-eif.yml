name: Escrow Enclave EIF

# P2.2 EIF pipeline. See
# services/escrow-enclave-app/README.md ("Reproducible build") and
# security/README.md for the full pipeline this workflow implements.
on:
    pull_request:
        paths:
            - 'services/escrow-enclave-app/**'
            - 'services/escrow-enclave-host/**'
            - '.github/workflows/escrow-enclave-eif.yml'
    push:
        branches:
            - main
        # Tag pushes bypass `paths` entirely (GitHub does not evaluate path
        # filters for tag pushes), so this also fires on every
        # escrow-enclave-v* tag regardless of which files changed.
        tags:
            - 'escrow-enclave-v*'
        paths:
            - 'services/escrow-enclave-app/**'
            - 'services/escrow-enclave-host/**'
            - '.github/workflows/escrow-enclave-eif.yml'
    workflow_dispatch:
        inputs:
            deployment:
                description: Measured build environment (production also publishes to its S3 bucket)
                type: choice
                default: staging
                options:
                    - staging
                    - production

# Default: read-only. Jobs below grant only the extra scope they need
# (`eif` adds id-token for cosign keyless; `publish-measurements` adds
# contents/pull-requests to open its PR).
permissions:
    contents: read

env:
    MONGOMS_DISABLE_POSTINSTALL: '1'
    CARGO_AUDIT_VERSION: '0.22.2'

jobs:
    # ---------------------------------------------------------------------
    # Native test/lint/audit gate. Runs on every PR and push that touches
    # this crate (or this workflow file), plus workflow_dispatch. No Nitro
    # tooling required — this is plain `cargo` on a GitHub-hosted runner.
    # ---------------------------------------------------------------------
    test:
        name: test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: services/escrow-enclave-app
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              # No submodules: escrow-enclave-app has zero git dependencies
              # (`grep -c '^source = "git"' Cargo.lock` => 0) and its only
              # `path = ...` entries are its own src/main.rs / src/lib.rs —
              # unlike lib/didkit and lib/ssi, this crate has no path deps
              # into repo submodules. See notepad issues.md "P2.2 report".

            - name: Setup Rust (1.93.0 + rustfmt/clippy, per rust-toolchain.toml)
              uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              # Pinned to `master`, not a per-version branch: dtolnay/rust-toolchain's
              # own README requires pinning a SHA that's in master's history (other
              # branches, e.g. `1.93.0`, are NOT ancestors of master and can be
              # garbage-collected — confirmed via `gh api .../compare/master...1.93.0`
              # returning "diverged" for this repo). master's README explicitly
              # recommends this exact pattern: pin @master, pass `toolchain:` as an
              # explicit input.
              with:
                  toolchain: 1.93.0
                  components: rustfmt, clippy

            # Mirrors .github/workflows/didkit-plugin-node-prebuilds.yml's cargo
            # cache shape (same action, same registry/git-db path categories,
            # keyed on hashFiles(Cargo.lock)), adapted to this crate's own
            # target dir (there is no root Cargo workspace) and this job's
            # single ubuntu-latest runner (no cross-compile matrix, so
            # `runner.os` replaces didkit's `matrix.settings.target` prefix).
            # Also caches the RustSec advisory-db clone `cargo audit` needs,
            # so repeat runs only `git pull` it instead of a fresh clone.
            - name: Cache cargo
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      ~/.cargo/advisory-db
                      services/escrow-enclave-app/target/
                  key: ${{ runner.os }}-cargo-escrow-enclave-app-${{ hashFiles('services/escrow-enclave-app/Cargo.lock') }}

            # cargo-audit is a separate installed binary, not part of the
            # crate's own Cargo.lock — cache it by its own pinned version so
            # a hit skips a ~45s source build entirely.
            - name: Cache cargo-audit binary
              id: cargo-audit-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cargo/bin/cargo-audit
                  key: ${{ runner.os }}-cargo-audit-bin-${{ env.CARGO_AUDIT_VERSION }}

            - name: Install cargo-audit (pinned)
              if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
              run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

            - name: cargo fmt --check
              run: cargo fmt --check

            - name: cargo clippy (default features)
              run: cargo clippy -- -D warnings

            - name: cargo clippy (fake-* features)
              run: cargo clippy --features fake-ledger,fake-time,fake-kms,fake-nsm -- -D warnings

            - name: cargo test
              run: cargo test

            - name: cargo test (KMS and dormant authority foundations)
              run: cargo test --locked --features kms

            - name: Public measurement configuration contract
              run: bash scripts/test-measurement-config.sh

            - name: cargo check (nitro,kms)
              run: cargo check --features nitro,kms

            # Only RUSTSEC-2023-0071 (the `rsa` crate's Marvin timing-sidechannel
            # advisory) is authorized to be ignored, per notepad decisions.md D11
            # ("not exploitable as an oracle here" — CMS blob only ever arrives
            # inside the enclave's own TLS session to KMS, never host-supplied).
            # No other ignores are authorized without a new, explicit decision.
            #
            # KNOWN GAP (see notepad problems.md / issues.md "P2.2 report"): as
            # of 2026-09-25, `cargo audit` ALSO reports RUSTSEC-2026-0258 (h2
            # 0.3.27), RUSTSEC-2026-0104/0098/0099 (rustls-webpki 0.101.7) — all
            # transitively pulled in by aws-nitro-enclaves-{cose,nsm-api}'s older
            # hyper/rustls stack (`nitro` feature) — plus an "unmaintained"
            # WARNING for serde_cbor (same two crates). None of these are
            # covered by D11's single sanctioned ignore, so THIS STEP IS
            # EXPECTED TO FAIL until a follow-up task either upgrades those
            # dependencies or gets explicit sign-off to add more `--ignore`
            # flags. Deliberately NOT silenced here: this task's scope forbids
            # editing Cargo.toml/Cargo.lock, and unilaterally adding more
            # ignores to a security-critical enclave's CI gate is exactly the
            # kind of decision that belongs in decisions.md, not a drive-by
            # workflow edit.
            - name: cargo audit (D11 rsa/Marvin ignore only)
              run: cargo audit --ignore RUSTSEC-2023-0071

    # ---------------------------------------------------------------------
    # PR-only, NON-signing smoke test of build-host.sh: two builds in the
    # pinned image, fail on sha256 mismatch. No cosign, no id-token, no
    # secrets/vars, no environment; read-only token. Non-PR events skip it
    # because the `eif` job runs the same double build there.
    # ---------------------------------------------------------------------
    host-build-smoke:
        name: host-build-smoke
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Build host binary (host-a)
              run: services/escrow-enclave-host/scripts/build-host.sh --out "${RUNNER_TEMP}/host-a"

            - name: Build host binary (host-b)
              run: services/escrow-enclave-host/scripts/build-host.sh --out "${RUNNER_TEMP}/host-b"

            - name: Verify host binary reproducibility (host-a vs host-b)
              run: |
                  set -euo pipefail
                  a="$(cut -d' ' -f1 "${RUNNER_TEMP}/host-a/escrow-enclave-host.sha256")"
                  b="$(cut -d' ' -f1 "${RUNNER_TEMP}/host-b/escrow-enclave-host.sha256")"
                  echo "host-a: ${a}"
                  echo "host-b: ${b}"
                  if [[ "${a}" != "${b}" ]]; then
                      echo "::error::escrow-enclave-host is not reproducible between two builds"
                      exit 1
                  fi
                  (cd "${RUNNER_TEMP}/host-a" && sha256sum -c escrow-enclave-host.sha256)

    # ---------------------------------------------------------------------
    # Reproducible EIF build + PCR measurement + keyless signing.
    #
    # Runs on a plain GitHub-hosted runner: `nitro-cli build-enclave` does
    # NOT require the Nitro Enclaves kernel driver or Nitro-capable EC2
    # hardware — AWS documents building EIFs "on any Linux environment,
    # including outside of AWS" (only `run-enclave`, i.e. actually launching
    # an enclave, needs real hardware). nitro-cli itself runs containerized
    # (services/escrow-enclave-app/scripts/nitro-cli-container.sh, a pinned
    # Amazon Linux 2023 image reached through this runner's own Docker
    # socket) rather than requiring a self-hosted Amazon Linux host — see
    # that script and nitro-cli.Dockerfile for the citation trail, and
    # security/README.md for the full rundown of what changed.
    #
    # Still restricted to push (main or an escrow-enclave-v* tag) and
    # workflow_dispatch — NEVER pull_request, including same-repo PRs.
    # GitHub-hosted runners are ephemeral (a fresh VM per job, destroyed
    # after), so this is no longer about protecting persistent self-hosted
    # infrastructure from untrusted PR code. It's restricted because this
    # job (a) mints a cosign keyless signature under the repository's own
    # GitHub OIDC identity over the produced measurements — that identity
    # should only ever attest to builds from reviewed, protected commit
    # history (a branch push or tag), not an arbitrary PR head/merge commit
    # nobody has reviewed yet; and (b) requires manual approval against the
    # `escrow-staging` environment below — gating every open PR behind that
    # approval would both spam reviewers and let any PR author force
    # approval-gated compute to run merely by opening a PR.
    # `success() &&` is required in the `if:` below because providing any
    # custom `if:` expression replaces (rather than ANDs with) the implicit
    # `needs`-success check GitHub would otherwise apply.
    # ---------------------------------------------------------------------
    eif:
        name: eif
        needs: test
        if: >-
            success() && github.event_name != 'pull_request' &&
            (inputs.deployment != 'production' ||
             github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/escrow-enclave-v'))
        runs-on: ubuntu-latest
        # Measured config differs per deployment; each environment holds its
        # own vars and requires an approver before the build runs.
        environment: ${{ inputs.deployment == 'production' && 'escrow-production' || 'escrow-staging' }}
        env:
            # No parent environment is inherited by an EIF. Both builds bake the
            # same reviewed public configuration; missing required vars fail closed.
            ESCROW_TENANT: ${{ vars.ESCROW_TENANT }}
            ESCROW_KEY_ID: ${{ vars.ESCROW_KEY_ID }}
            ESCROW_KMS_REGION: ${{ vars.ESCROW_KMS_REGION }}
            ESCROW_KMS_KEY_ARN: ${{ vars.ESCROW_KMS_KEY_ARN }}
            ESCROW_PREVIOUS_KEY_IDS: ${{ vars.ESCROW_PREVIOUS_KEY_IDS }}
            ESCROW_ALLOW_FIRST_BOOT: ${{ vars.ESCROW_ALLOW_FIRST_BOOT || 'false' }}
            # Optional public settings are measured/reported, not runtime activation flags.
            ESCROW_AUTHORITY_REGION: ${{ vars.ESCROW_AUTHORITY_REGION }}
            ESCROW_AUTHORITY_ACCOUNT_ID: ${{ vars.ESCROW_AUTHORITY_ACCOUNT_ID }}
            ESCROW_AUTHORITY_TABLE: ${{ vars.ESCROW_AUTHORITY_TABLE }}
            ESCROW_AUTHORITY_WRITER_USER: ${{ vars.ESCROW_AUTHORITY_WRITER_USER }}
            ESCROW_AUTHORITY_TENANT: ${{ vars.ESCROW_AUTHORITY_TENANT }}
            ESCROW_AUTHORITY_ENVIRONMENT: ${{ vars.ESCROW_AUTHORITY_ENVIRONMENT }}
            ESCROW_AUTHORITY_GENERATION: ${{ vars.ESCROW_AUTHORITY_GENERATION }}
            ESCROW_AUTHORITY_CREDENTIAL_KMS_KEY_ARN: ${{ vars.ESCROW_AUTHORITY_CREDENTIAL_KMS_KEY_ARN }}
            ESCROW_EMAIL_REGION: ${{ vars.ESCROW_EMAIL_REGION }}
            ESCROW_EMAIL_ACCOUNT_ID: ${{ vars.ESCROW_EMAIL_ACCOUNT_ID }}
            ESCROW_EMAIL_SENDER_USER: ${{ vars.ESCROW_EMAIL_SENDER_USER }}
            ESCROW_EMAIL_FROM: ${{ vars.ESCROW_EMAIL_FROM }}
            ESCROW_EMAIL_IDENTITY: ${{ vars.ESCROW_EMAIL_IDENTITY }}
            ESCROW_EMAIL_CONFIGURATION_SET: ${{ vars.ESCROW_EMAIL_CONFIGURATION_SET }}
        permissions:
            contents: read
            id-token: write # cosign keyless signing (GitHub OIDC -> Fulcio/Rekor); granted on this job only.
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Build EIF (build-a)
              run: |
                  set -euo pipefail
                  services/escrow-enclave-app/scripts/build-eif.sh \
                      --out "${GITHUB_WORKSPACE}/build-a" \
                      --source-date-epoch "$(git log -1 --format=%ct)"

            - name: Build EIF (build-b)
              run: |
                  set -euo pipefail
                  services/escrow-enclave-app/scripts/build-eif.sh \
                      --out "${GITHUB_WORKSPACE}/build-b" \
                      --source-date-epoch "$(git log -1 --format=%ct)"

            - name: Verify PCR0/1/2 reproducibility (build-a vs build-b)
              run: |
                  services/escrow-enclave-app/scripts/verify-measurements.sh \
                      "${GITHUB_WORKSPACE}/build-a/measurements.json" \
                      "${GITHUB_WORKSPACE}/build-b/measurements.json"

            # Re-load explicitly from build-a's own image.tar (rather than
            # trusting whatever the local Docker daemon currently has tagged)
            # so this step verifiably checks build-a specifically, per this
            # task's spec — the prior step already proved build-b is
            # byte-identical, but this keeps the provenance unambiguous.
            - name: Extract binary from build-a/image.tar
              run: |
                  set -euo pipefail
                  docker load -i "${GITHUB_WORKSPACE}/build-a/image.tar"
                  image_tag="$(jq -r '.imageTag' "${GITHUB_WORKSPACE}/build-a/measurements.json")"
                  container_id="$(docker create "${image_tag}")"
                  docker cp "${container_id}:/escrow-enclave" "${GITHUB_WORKSPACE}/build-a/escrow-enclave-binary"
                  docker rm "${container_id}" >/dev/null

            - name: Check binary for leaked host build paths
              run: |
                  services/escrow-enclave-app/scripts/check-binary-paths.sh \
                      "${GITHUB_WORKSPACE}/build-a/escrow-enclave-binary"

            # Host binary from the SAME checkout, so the EIF and the parent host
            # that must parse its wire responses are paired by construction
            # (2026-10-23: a new EIF with an Oct 15 host broke create-hold with
            # 503 `unavailable`). Built twice in the pinned amazonlinux:2023
            # amd64 image with the rust-toolchain.toml toolchain; a sha256
            # mismatch fails the job (same fail-closed stance as the PCR check).
            - name: Build host binary (host-a)
              run: |
                  set -euo pipefail
                  services/escrow-enclave-host/scripts/build-host.sh --out "${GITHUB_WORKSPACE}/host-a"

            - name: Build host binary (host-b)
              run: |
                  set -euo pipefail
                  services/escrow-enclave-host/scripts/build-host.sh --out "${GITHUB_WORKSPACE}/host-b"

            - name: Verify host binary reproducibility (host-a vs host-b)
              run: |
                  set -euo pipefail
                  a="$(cut -d' ' -f1 "${GITHUB_WORKSPACE}/host-a/escrow-enclave-host.sha256")"
                  b="$(cut -d' ' -f1 "${GITHUB_WORKSPACE}/host-b/escrow-enclave-host.sha256")"
                  echo "host-a: ${a}"
                  echo "host-b: ${b}"
                  if [[ "${a}" != "${b}" ]]; then
                      echo "::error::escrow-enclave-host is not reproducible between two builds"
                      exit 1
                  fi
                  (cd "${GITHUB_WORKSPACE}/host-a" && sha256sum -c escrow-enclave-host.sha256)

            # `gitCommit`, `nitroCliVersion` and `nitroCliContainerImage` are
            # already present via build-a's own measurements.json (written by
            # build-eif.sh / nitro-cli-container.sh — nitro-cli no longer
            # runs on this runner directly, so its version can't be queried
            # here the way it could on the old self-hosted AL2023 runner);
            # this just adds the one field that script has no way to know
            # about itself.
            - name: Produce escrow-measurements.json
              run: |
                  set -euo pipefail
                  jq \
                      --arg workflowRunId "${GITHUB_RUN_ID}" \
                      '. + {workflowRunId: $workflowRunId}' \
                      "${GITHUB_WORKSPACE}/build-a/measurements.json" \
                      >"${GITHUB_WORKSPACE}/escrow-measurements.json"

            - name: Build signing manifest (SHA-256 of EIF + measurements + host binary)
              run: |
                  set -euo pipefail
                  eif_sha256="$(sha256sum "${GITHUB_WORKSPACE}/build-a/escrow-enclave.eif" | cut -d' ' -f1)"
                  measurements_sha256="$(sha256sum "${GITHUB_WORKSPACE}/escrow-measurements.json" | cut -d' ' -f1)"
                  host_sha256="$(sha256sum "${GITHUB_WORKSPACE}/host-a/escrow-enclave-host" | cut -d' ' -f1)"
                  jq -n \
                      --arg eifSha256 "${eif_sha256}" \
                      --arg measurementsSha256 "${measurements_sha256}" \
                      --arg hostSha256 "${host_sha256}" \
                      --slurpfile hostBuild "${GITHUB_WORKSPACE}/host-a/host-build.json" \
                      --arg gitSha "${GITHUB_SHA}" \
                      --arg workflowRunId "${GITHUB_RUN_ID}" \
                      --slurpfile measurements "${GITHUB_WORKSPACE}/escrow-measurements.json" \
                      '{eifSha256: $eifSha256, measurementsSha256: $measurementsSha256, hostSha256: $hostSha256, hostBuild: $hostBuild[0], gitSha: $gitSha, workflowRunId: $workflowRunId, config: $measurements[0].config}' \
                      >"${GITHUB_WORKSPACE}/manifest.json"

            # This job now runs on a plain GitHub-hosted `ubuntu-latest`
            # runner (see the job's header comment), which is exactly what
            # sigstore/cosign-installer is built for — the previous caveat
            # here ("self-hosted runners may not work", per the action's own
            # README) no longer applies. See security/README.md for the
            # prior self-hosted-runner history and what changed.
            - name: Install cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
              with:
                  cosign-release: 'v3.1.3'

            - name: Sign manifest (cosign keyless, GitHub OIDC)
              run: |
                  cosign sign-blob --yes \
                      --bundle "${GITHUB_WORKSPACE}/manifest.json.sigstore.json" \
                      "${GITHUB_WORKSPACE}/manifest.json"

            - name: Upload EIF + host binary + measurements + manifest + signature
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: escrow-enclave-eif-${{ github.run_id }}-${{ github.run_attempt }}
                  retention-days: 90
                  if-no-files-found: error
                  path: |
                      ${{ github.workspace }}/build-a/escrow-enclave.eif
                      ${{ github.workspace }}/host-a/escrow-enclave-host
                      ${{ github.workspace }}/host-a/escrow-enclave-host.sha256
                      ${{ github.workspace }}/host-a/host-build.json
                      ${{ github.workspace }}/escrow-measurements.json
                      ${{ github.workspace }}/manifest.json
                      ${{ github.workspace }}/manifest.json.sigstore.json

    # ---------------------------------------------------------------------
    # On a release tag only: publish the verified measurements into the
    # repo via PR (never a direct push — notepad decisions.md D10 requires
    # two-person review on measurement changes, since a wrong/malicious
    # PCR tuple lets an attacker's enclave image pass client pinning).
    # ---------------------------------------------------------------------
    publish-measurements:
        name: publish-measurements
        needs: eif
        if: success() && inputs.deployment != 'production' && startsWith(github.ref, 'refs/tags/escrow-enclave-v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Download EIF artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: escrow-enclave-eif-${{ github.run_id }}-${{ github.run_attempt }}
                  path: downloaded-artifacts

            - name: Copy measurements into security/escrow-measurements/
              run: |
                  set -euo pipefail
                  mkdir -p security/escrow-measurements
                  cp downloaded-artifacts/escrow-measurements.json \
                      "security/escrow-measurements/${GITHUB_REF_NAME}.json"

            - name: Open PR with new measurements
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
              with:
                  base: main
                  branch: escrow-measurements/${{ github.ref_name }}
                  add-paths: security/escrow-measurements/**
                  commit-message: 'chore(security): publish escrow enclave measurements for ${{ github.ref_name }}'
                  title: 'security: escrow enclave measurements for ${{ github.ref_name }}'
                  labels: security
                  body: |
                      Automated PR from `.github/workflows/escrow-enclave-eif.yml` (`publish-measurements` job).

                      Adds `security/escrow-measurements/${{ github.ref_name }}.json`, produced by a
                      reproducible double-build (PCR0/1/2 verified identical between two independent
                      `nitro-cli build-enclave` runs) of `services/escrow-enclave-app` at commit
                      `${{ github.sha }}`, workflow run `${{ github.run_id }}`.

                      **Per notepad decision D10, measurement changes need two-person review before
                      merge — do not self-approve.** See `security/README.md` for how these PCRs flow
                      into `infra/escrow-enclave` tfvars (`enclave_measurements`) and tenant
                      `escrowEnclaveMeasurements`, and for the N / N+1 rotation procedure (never remove
                      the previous measurement until every enclave instance and every client rollout
                       has moved to the new one).

    # Production is opt-in via workflow_dispatch, including on a release tag.
    # Never promote the staging EIF: public account/CMK settings are measured.
    publish-production:
        needs: eif
        if: >-
            success() && github.event_name == 'workflow_dispatch' && inputs.deployment == 'production' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/escrow-enclave-v'))
        runs-on: ubuntu-latest
        # Separate approval/token subject: the build's cosign token cannot publish.
        environment: escrow-production-publish
        permissions:
            contents: read
            id-token: write
        env:
            ARTIFACTS_BUCKET: ${{ vars.ESCROW_ARTIFACTS_BUCKET }}
            ARTIFACTS_KMS_KEY_ARN: ${{ vars.ESCROW_ARTIFACTS_KMS_KEY_ARN }}
        steps:
            - name: Download this run's production artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: escrow-enclave-eif-${{ github.run_id }}-${{ github.run_attempt }}
                  path: downloaded-artifacts

            - name: Install cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
              with:
                  cosign-release: 'v3.1.3'

            - name: Verify signature, manifest digests, and run provenance before AWS access
              working-directory: downloaded-artifacts
              run: |
                  set -euo pipefail
                  cosign verify-blob \
                    --bundle manifest.json.sigstore.json \
                    --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
                    --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                    manifest.json
                  jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
                    '.gitSha == $sha and .workflowRunId == $run and
                     (.eifSha256 | test("^[a-f0-9]{64}$")) and
                     (.measurementsSha256 | test("^[a-f0-9]{64}$")) and
                     (.hostSha256 | test("^[a-f0-9]{64}$"))' manifest.json
                  printf '%s  %s\n' "$(jq -r .eifSha256 manifest.json)" build-a/escrow-enclave.eif \
                    "$(jq -r .measurementsSha256 manifest.json)" escrow-measurements.json \
                    "$(jq -r .hostSha256 manifest.json)" host-a/escrow-enclave-host | sha256sum -c -
                  jq -e --slurpfile measurements escrow-measurements.json \
                    '.config == $measurements[0].config' manifest.json

            - name: Assume production artifact publisher (no Terraform or escrow-key access)
              uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
              with:
                  role-to-assume: ${{ vars.ESCROW_PUBLISH_ROLE_ARN }}
                  # Trust only the separately protected publishing environment.
                  role-duration-seconds: 3600
                  aws-region: ${{ vars.ESCROW_KMS_REGION }}
                  allowed-account-ids: ${{ vars.ESCROW_ACCOUNT_ID }}

            - name: Publish write-once objects and verify readback
              working-directory: downloaded-artifacts
              run: |
                  set -euo pipefail
                  : "${ARTIFACTS_BUCKET:?Set ESCROW_ARTIFACTS_BUCKET}"
                  : "${ARTIFACTS_KMS_KEY_ARN:?Set ESCROW_ARTIFACTS_KMS_KEY_ARN}"
                  prefix="eif/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
                  for file in build-a/escrow-enclave.eif escrow-measurements.json manifest.json manifest.json.sigstore.json; do
                    key="${prefix}/${file##*/}"
                    aws s3api put-object --bucket "$ARTIFACTS_BUCKET" --key "$key" \
                      --body "$file" --if-none-match '*' --server-side-encryption aws:kms \
                      --ssekms-key-id "$ARTIFACTS_KMS_KEY_ARN"
                    aws s3api get-object --bucket "$ARTIFACTS_BUCKET" --key "$key" "${RUNNER_TEMP}/escrow-readback"
                    cmp "$file" "${RUNNER_TEMP}/escrow-readback"
                  done
