name: Validate Published Package Contracts

# Runs publint + @arethetypeswrong/cli against every published @learncard/*
# package's actual built `dist/`. Designed to catch the kind of packaging
# regressions that internal CI misses but that break external consumers the
# moment a release hits npm — the same class of bug as the `workspace:*`
# leakage incident and the @learncard/init ESM-named-export regression.
#
# Two layers:
#   1. publint  — static manifest + dist validation (missing exports map,
#                 file paths that don't resolve, type condition ordering,
#                 ESM file with CJS extension, etc.)
#   2. attw     — build package tarballs + resolve through every TypeScript
#                 module resolution mode (node10, node16, bundler) and consumer
#                 style (ESM import, CJS require).
#
# Failure modes:
#   - Gating packages (default set) → CI fails
#   - Advisory packages (see ADVISORY_ONLY in scripts/validate-packages.mjs)
#     → diagnostics printed, exit zero
#
# Runs on every PR + push to main. The validation script runs publint + attw
# (the latter validates generated package tarballs) across ~36 packages with a
# bounded concurrency pool; combined with the up-front `bun run build`, budget ~10-15 min.

on:
    pull_request:
        types: [opened, synchronize]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    validate-packages:
        name: publint + attw
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            - name: Build publishable packages
              run: >
                  bunx nx run-many -t build -p
                  core
                  credential-library
                  lca-api-client
                  lca-api-plugin
                  cli
                  helpers
                  init
                  mcp
                  partner-connect-sdk
                  partner-connect-core
                  types
                  sss-key-manager
                  claimable-boosts-plugin
                  chapi-plugin
                  ceramic-plugin
                  crypto-plugin
                  didkey-plugin
                  didkit-plugin
                  didkit-plugin-node
                  did-web-plugin
                  dynamic-loader-plugin
                  encryption-plugin
                  ethereum-plugin
                  expiration-plugin
                  idx-plugin
                  learn-card-plugin
                  learn-cloud-plugin
                  ler-rs-plugin
                  linked-claims-plugin
                  network-plugin
                  open-badge-v2-plugin
                  openid4vc-plugin
                  render-method-plugin
                  sd-jwt-vc-plugin
                  vc-api-plugin
                  vc-plugin
                  vc-templates-plugin
                  vpqr-plugin

            - name: Validate package contracts
              run: bun scripts/validate-packages.mjs

    # @learncard/cli is published as one self-contained file (bundled by
    # packages/learn-card-cli/scripts/build.ts) with no install-time dependencies.
    # Pack it exactly as the release does, then cold-install and run it with npx on
    # every supported Node version, so a dependency or engines regression fails the
    # PR instead of the release.
    pack-cli:
        name: Pack self-contained CLI
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            - name: Test release tooling for bundled packages
              run: >
                  node --test
                  scripts/release-bundled-dependents.test.mjs
                  scripts/prepare-publish-workspace-deps.test.mjs

            - name: Build CLI
              run: bunx nx run-many -t build -p cli

            # Same manifest rewrite the publish job runs: resolves workspace ranges
            # and, after checking the bundle, omits the bundled dependency list.
            - name: Prepare publish manifest
              run: node scripts/prepare-publish-workspace-deps.mjs --package=@learncard/cli

            - name: Pack
              working-directory: packages/learn-card-cli
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/cli-tarball"
                  npm pack --pack-destination "$RUNNER_TEMP/cli-tarball"

            - name: Upload tarball
              uses: actions/upload-artifact@v4
              with:
                  name: learncard-cli-tarball
                  path: ${{ runner.temp }}/cli-tarball/*.tgz
                  if-no-files-found: error
                  retention-days: 3

    cli-install-budget:
        name: CLI cold install (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        needs: pack-cli
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22, 24]
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node.js ${{ matrix.node }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}

            - name: Download tarball
              uses: actions/download-artifact@v4
              with:
                  name: learncard-cli-tarball
                  path: ${{ runner.temp }}/cli-tarball

            - name: Cold install, run, and check the install budget
              run: |
                  set -euo pipefail
                  TARBALL=$(ls "$RUNNER_TEMP"/cli-tarball/*.tgz)
                  node scripts/check-cli-install.mjs --package="file:$TARBALL"
