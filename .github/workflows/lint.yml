name: Lint

on:
    pull_request:
        types: [opened, synchronize]

concurrency:
    group: lint-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Share installation for the short source checks; keep the long ESLint gate independent.
    SourceLint:
        name: Source lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Fetch main for comparison
              run: git fetch --no-tags --prune origin main

            - name: Use Composite Setup Action
              id: setup
              uses: ./.github/actions/setup

            # An earlier guard failure must not hide the remaining diagnostics.
            # Setup failures/cancellation still stop checks that cannot run safely.
            - name: Run oxlint
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: bun run lint:ox

            - name: Prettier check (changed files only)
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: |
                  # NUL-delimited paths stay data, including spaces, quotes and newlines.
                  git diff --name-only --diff-filter=ACMR -z origin/main...HEAD > "$RUNNER_TEMP/prettier-changes"
                  node -e '
                    const { readFileSync } = require("node:fs");
                    const files = readFileSync(process.argv[1], "utf8").split("\0")
                      .filter(file => /\.(ts|tsx|js|jsx|json|md|ya?ml|css|html)$/.test(file));
                    if (files.length) process.stdout.write(files.join("\0") + "\0");
                    else console.error("No lintable files changed in this PR.");
                  ' "$RUNNER_TEMP/prettier-changes" > "$RUNNER_TEMP/prettier-files"
                  xargs -0 -r bunx prettier --check -- < "$RUNNER_TEMP/prettier-files"

            - name: Run LearnCard app and shared library jsx-a11y lint
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: bun run lint:a11y

            - name: Run frozen-memo guard
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              working-directory: apps/learn-card-app
              run: bun run i18n:check-memos

            - name: Run ScoutPass i18n AST guards
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              working-directory: apps/scouts
              run: |
                  bun run i18n:check-memos
                  bun run i18n:check-ast
                  bun run test:i18n

    WorkspaceLint:
        name: Run workspace lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            # Restore before installation so hashFiles sees repository inputs only.
            # Keep the config prefix strict: ESLint's file cache cannot track external inputs.
            - name: Compute workspace ESLint cache prefix
              id: lint-cache-key
              env:
                  CACHE_PREFIX: ${{ runner.os }}-${{ runner.arch }}-workspace-eslint-v1-${{ hashFiles('bun.lock', 'bunfig.toml', '.github/workflows/lint.yml', '.github/actions/setup/action.yml', 'scripts/lint-workspace*', 'scripts/eslint-baseline.json', '**/package.json', '**/project.json', '**/tsconfig*.json', '**/*eslint*config*', '**/eslint-rules/**', '**/.eslintignore', '**/*prettier*', '**/.editorconfig', '**/.gitignore') }}
              run: printf 'prefix=%s\n' "$CACHE_PREFIX" >> "$GITHUB_OUTPUT"

            - name: Reuse workspace ESLint cache
              uses: actions/cache@v6
              with:
                  path: .nx-cache/eslint
                  key: ${{ steps.lint-cache-key.outputs.prefix }}-${{ github.event.pull_request.head.sha }}
                  restore-keys: |
                      ${{ steps.lint-cache-key.outputs.prefix }}-

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            - name: Test lint discovery and cache correctness
              run: node --test scripts/lint-workspace.test.mjs

            - name: Test proof publisher (offline fixtures)
              run: node --test scripts/proof.test.mjs

            - name: Run workspace lint
              run: bun run lint:workspace

    RepositoryContracts:
        name: Repository shell contracts
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.3'

            - name: Test mock E2E CI policy
              run: node --test scripts/mock-e2e-ci.test.cjs

            - name: Run repository shell contracts
              run: |
                  for contract in .github/tests/*.test.sh; do
                    echo "Running $contract"
                    bash "$contract"
                  done
                  for contract in .github/tests/*.test.cjs; do
                    echo "Running $contract"
                    node "$contract"
                  done

    # These guards only need Node and checked-in files; no dependency install/build.
    StaticChecks:
        name: Repository static checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              id: checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Test no-Jest guard
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node --test scripts/check-no-jest.test.mjs

            - name: Check test-runner contract
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node scripts/check-no-jest.mjs

            - name: Check for missing i18n message keys
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node apps/learn-card-app/scripts/check-i18n-keys.mjs

            - name: Check ScoutPass i18n keys, imports, and parity
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: |
                  node apps/scouts/scripts/check-i18n-keys.mjs
                  node apps/scouts/scripts/check-i18n-imports.mjs
                  node apps/scouts/scripts/check-i18n-parity.mjs

            # Interpolation integrity: every es/fr/ar value must carry the same
            # {{vars}} and <n> markup as its en source. Renamed/hallucinated vars
            # and markup drift fail hard; correct linguistic drops are allowlisted
            # in scripts/i18n-marker-allowlist.json.
            - name: Check i18n interpolation markers
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node apps/learn-card-app/scripts/check-i18n-markers.mjs --strict

            - name: Check ScoutPass i18n interpolation markers
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node apps/scouts/scripts/check-i18n-markers.mjs --strict

            # English-fallback guard: no es/fr/ar value may be a verbatim copy of
            # the English source (renders English under a non-English UI). Verified
            # legitimate cognates/brand/code are baselined in
            # scripts/i18n-untranslated-allowlist.json.
            - name: Check for untranslated (English-fallback) i18n values
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node apps/learn-card-app/scripts/check-i18n-untranslated.mjs --strict

            - name: Check ScoutPass untranslated i18n values
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node apps/scouts/scripts/check-i18n-untranslated.mjs --strict

            - name: Verify numeric Bitstring Status List compatibility
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node packages/plugins/didkit/scripts/check-wasm-numeric-status.mjs

            - name: Verify checked-in WASM matches the default init() URL
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node packages/plugins/didkit/scripts/check-wasm-url.mjs

            - name: Safe-area ownership gate
              if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
              run: node scripts/check-safe-area.mjs
