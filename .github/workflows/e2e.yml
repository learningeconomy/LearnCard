name: E2E

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    # Merge queue: GitHub creates a temporary branch with the PR(s) merged onto
    # current main and runs this once per batch. This is what lets PRs stay
    # mergeable without every author re-running E2E after main moves.
    merge_group:
        types: [checks_requested]
    workflow_dispatch:
        inputs:
            ref:
                description: 'LearnCard ref to test'
                required: false
                default: 'main'
            test_files:
                description: 'Browser spec files, separated by spaces'
                required: false
                default: 'consent-flow-race.spec.ts app-store.spec.ts wallet-credentials.spec.ts'
            use_sdk_cache:
                description: 'Restore SDK outputs; false runs an identical cold-build baseline.'
                type: boolean
                default: true
            verify_sdk_producer:
                description: 'Also validate the SDK producer; feature refs never publish shared output.'
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
    cancel-in-progress: true

env:
    E2E_TESTED_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.inputs.ref || github.sha }}

jobs:
    sdk_cache_probe:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk_producer }}
        uses: ./.github/workflows/sdk-build-cache.yml

    eligibility:
        name: Determine E2E eligibility
        runs-on: ubuntu-latest
        outputs:
            run_e2e: ${{ steps.policy.outputs.run_e2e }}
            reason: ${{ steps.policy.outputs.reason }}
        steps:
            - name: Checkout for change detection
              if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.E2E_TESTED_REF }}
                  fetch-depth: 0

            - name: Evaluate PR policy
              id: policy
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_DRAFT: ${{ github.event.pull_request.draft || false }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                    echo 'run_e2e=true' >> "$GITHUB_OUTPUT"
                    echo 'reason=manual-dispatch' >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
                    echo 'run_e2e=false' >> "$GITHUB_OUTPUT"
                    echo 'reason=draft-pr' >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if bash scripts/e2e-hosted/changes-are-docs-only.sh "$BASE_SHA" HEAD; then
                    echo 'run_e2e=false' >> "$GITHUB_OUTPUT"
                    echo 'reason=docs-only' >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo 'run_e2e=true' >> "$GITHUB_OUTPUT"
                  echo "reason=$EVENT_NAME" >> "$GITHUB_OUTPUT"

            - name: Validate E2E eligibility
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_DRAFT: ${{ github.event.pull_request.draft || false }}
                  RUN_E2E: ${{ steps.policy.outputs.run_e2e }}
                  REASON: ${{ steps.policy.outputs.reason }}
              run: |
                  case "$EVENT_NAME:$RUN_E2E:$REASON" in
                    workflow_dispatch:true:manual-dispatch|merge_group:true:merge_group|merge_group:false:docs-only) ;;
                    pull_request:false:draft-pr) [[ "$PR_DRAFT" == true ]] || exit 1 ;;
                    pull_request:true:pull_request|pull_request:false:docs-only) [[ "$PR_DRAFT" == false ]] || exit 1 ;;
                    *) echo 'Invalid E2E eligibility decision' >&2; exit 1 ;;
                  esac
                  printf '## E2E eligibility\n\nRun suites: `%s`\n\nReason: `%s`\n' "$RUN_E2E" "$REASON" >> "$GITHUB_STEP_SUMMARY"

    playwright_e2e:
        name: Playwright E2E
        needs: eligibility
        if: ${{ needs.eligibility.outputs.run_e2e == 'true' }}
        runs-on: ${{ vars.E2E_HOSTED_RUNNER || 'ubuntu-latest' }}
        timeout-minutes: 60
        env:
            E2E_ARTIFACT_DIR: /tmp/learncard-e2e-artifacts/browser
            E2E_HOST_BROWSER_BUILD: 'true'
            E2E_TEST_FILES: ${{ github.event.inputs.test_files || 'consent-flow-race.spec.ts app-store.spec.ts wallet-credentials.spec.ts' }}
        steps:
            - name: Checkout tested revision
              id: checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.E2E_TESTED_REF }}
                  fetch-depth: 0

            - name: Capture runner preflight
              if: ${{ always() }}
              working-directory: ${{ runner.temp }}
              env:
                  CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
                  CHECKOUT_CONCLUSION: ${{ steps.checkout.conclusion }}
                  TESTED_REF: ${{ env.E2E_TESTED_REF }}
              run: |
                  mkdir -p "$E2E_ARTIFACT_DIR"
                  {
                    printf 'checkout_outcome=%s\n' "$CHECKOUT_OUTCOME"
                    printf 'checkout_conclusion=%s\n' "$CHECKOUT_CONCLUSION"
                  } > "$E2E_ARTIFACT_DIR/checkout-status.txt"
                  checkout_sha=unavailable
                  if [[ "$CHECKOUT_OUTCOME" == "success" ]]; then
                    checkout_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null) || checkout_sha=unavailable
                  fi
                  {
                    printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
                    printf 'event_sha=%s\n' "$GITHUB_SHA"
                    printf 'event_ref=%s\n' "$GITHUB_REF"
                    printf 'run_id=%s\n' "$GITHUB_RUN_ID"
                    printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
                    printf 'repository=%s\n' "$GITHUB_REPOSITORY"
                    printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
                    printf 'tested_ref=%s\n' "$TESTED_REF"
                    printf 'checkout_sha=%s\n' "$checkout_sha"
                  } > "$E2E_ARTIFACT_DIR/revision-provenance.txt"
                  {
                    echo 'checkout:'
                    cat "$E2E_ARTIFACT_DIR/checkout-status.txt"
                    echo 'filesystem:'
                    df -h /
                    echo 'memory:'
                    head -5 /proc/meminfo
                    echo 'docker:'
                    docker system df -v 2>&1 || true
                  } > "$E2E_ARTIFACT_DIR/runner-preflight.txt"

            - name: Prepare runner storage
              run: bash scripts/e2e-hosted/prepare-storage.sh

            - name: Authenticate Docker Hub pulls
              uses: ./.github/actions/dockerhub-login
              with:
                  username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
                  token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  # Hosted VMs are discarded after the job; retain cleanup on persistent runners.
                  cleanup: ${{ runner.environment != 'github-hosted' }}

            - name: Expose GitHub Actions cache runtime
              uses: crazy-max/ghaction-github-runtime@v3

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup
              with:
                  save-cache: 'false'

            - name: Prepare shared SDK build reuse
              uses: ./.github/actions/sdk-build-cache
              with:
                  use-cache: ${{ github.event.inputs.use_sdk_cache != 'false' }}

            - name: Run Playwright and accessibility suites
              # The preceding restore never represents test or app-build success.
              run: bash scripts/e2e-hosted/run-browser.sh

            - name: Publish browser diagnostic summary
              if: always()
              run: |
                  if [[ -f "$E2E_ARTIFACT_DIR/summary.md" ]]; then
                    cat "$E2E_ARTIFACT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo 'Playwright E2E diagnostics were not created.' >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload browser E2E artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-e2e-${{ github.run_id }}
                  path: ${{ env.E2E_ARTIFACT_DIR }}
                  if-no-files-found: error
                  retention-days: 30

    tests_e2e_1:
        name: tests/e2e (1)
        needs: eligibility
        if: ${{ needs.eligibility.outputs.run_e2e == 'true' }}
        runs-on: ${{ vars.E2E_HOSTED_RUNNER || 'ubuntu-latest' }}
        timeout-minutes: 60
        # Fixed job names remain present when eligibility skips the suites.
        # Each shard owns its stack; failure does not cancel the other shards.
        env:
            E2E_ARTIFACT_DIR: /tmp/learncard-e2e-artifacts/service
            E2E_SHARD: '1'
            E2E_SHARD_TOTAL: '3'
        steps: &service_e2e_steps
            - name: Checkout tested revision
              id: checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.E2E_TESTED_REF }}
                  fetch-depth: 0

            - name: Capture runner preflight
              if: ${{ always() }}
              working-directory: ${{ runner.temp }}
              env:
                  CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
                  CHECKOUT_CONCLUSION: ${{ steps.checkout.conclusion }}
                  TESTED_REF: ${{ env.E2E_TESTED_REF }}
              run: |
                  mkdir -p "$E2E_ARTIFACT_DIR"
                  {
                    printf 'checkout_outcome=%s\n' "$CHECKOUT_OUTCOME"
                    printf 'checkout_conclusion=%s\n' "$CHECKOUT_CONCLUSION"
                  } > "$E2E_ARTIFACT_DIR/checkout-status.txt"
                  checkout_sha=unavailable
                  if [[ "$CHECKOUT_OUTCOME" == "success" ]]; then
                    checkout_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null) || checkout_sha=unavailable
                  fi
                  {
                    printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
                    printf 'event_sha=%s\n' "$GITHUB_SHA"
                    printf 'event_ref=%s\n' "$GITHUB_REF"
                    printf 'run_id=%s\n' "$GITHUB_RUN_ID"
                    printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
                    printf 'repository=%s\n' "$GITHUB_REPOSITORY"
                    printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
                    printf 'tested_ref=%s\n' "$TESTED_REF"
                    printf 'checkout_sha=%s\n' "$checkout_sha"
                  } > "$E2E_ARTIFACT_DIR/revision-provenance.txt"
                  {
                    echo 'checkout:'
                    cat "$E2E_ARTIFACT_DIR/checkout-status.txt"
                    echo 'filesystem:'
                    df -h /
                    echo 'memory:'
                    head -5 /proc/meminfo
                    echo 'docker:'
                    docker system df -v 2>&1 || true
                  } > "$E2E_ARTIFACT_DIR/runner-preflight.txt"

            - name: Prepare runner storage
              run: bash scripts/e2e-hosted/prepare-storage.sh

            - name: Authenticate Docker Hub pulls
              uses: ./.github/actions/dockerhub-login
              with:
                  username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
                  token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  # Hosted VMs are discarded after the job; retain cleanup on persistent runners.
                  cleanup: ${{ runner.environment != 'github-hosted' }}

            - name: Expose GitHub Actions cache runtime
              uses: crazy-max/ghaction-github-runtime@v3

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Setup Bun and dependencies
              uses: ./.github/actions/setup
              with:
                  # One writer per E2E run avoids sibling jobs compressing the same cache.
                  save-cache: ${{ env.E2E_SHARD == '1' }}

            - name: Prepare shared SDK build reuse
              uses: ./.github/actions/sdk-build-cache
              with:
                  use-cache: ${{ github.event.inputs.use_sdk_cache != 'false' }}

            - name: Run tests/e2e
              run: bash scripts/e2e-hosted/run-service.sh

            - name: Publish service diagnostic summary
              if: always()
              run: |
                  echo "## tests/e2e shard ${E2E_SHARD}/${E2E_SHARD_TOTAL}" >> "$GITHUB_STEP_SUMMARY"
                  if [[ -f "$E2E_ARTIFACT_DIR/summary.md" ]]; then
                    cat "$E2E_ARTIFACT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo 'tests/e2e diagnostics were not created.' >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload service E2E artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: tests-e2e-${{ github.run_id }}-shard${{ env.E2E_SHARD }}
                  path: ${{ env.E2E_ARTIFACT_DIR }}
                  if-no-files-found: error
                  retention-days: 30

    tests_e2e_2:
        name: tests/e2e (2)
        needs: eligibility
        if: ${{ needs.eligibility.outputs.run_e2e == 'true' }}
        runs-on: ${{ vars.E2E_HOSTED_RUNNER || 'ubuntu-latest' }}
        timeout-minutes: 60
        env:
            E2E_ARTIFACT_DIR: /tmp/learncard-e2e-artifacts/service
            E2E_SHARD: '2'
            E2E_SHARD_TOTAL: '3'
        steps: *service_e2e_steps

    tests_e2e_3:
        name: tests/e2e (3)
        needs: eligibility
        if: ${{ needs.eligibility.outputs.run_e2e == 'true' }}
        runs-on: ${{ vars.E2E_HOSTED_RUNNER || 'ubuntu-latest' }}
        timeout-minutes: 60
        env:
            E2E_ARTIFACT_DIR: /tmp/learncard-e2e-artifacts/service
            E2E_SHARD: '3'
            E2E_SHARD_TOTAL: '3'
        steps: *service_e2e_steps
