name: Generate Client SDKs for LearnCard Network API

on:
    workflow_call:
        inputs:
            affected:
                required: true
                type: string

env:
    working-directory: packages/open-api-lcn-clients

jobs:
    generate-clients:
        runs-on: ubuntu-latest
        name: Generate Client SDKs for LearnCard Network API
        strategy:
            matrix:
                # generator-name: [python, java, swift5, kotlin, go, php, rust]
                generator-name: [python]
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  # create-pull-request manages its own git auth; persisting the
                  # checkout extraheader causes a "Duplicate header: Authorization"
                  # 400 with newer git (2.54+). See peter-evans/create-pull-request.
                  persist-credentials: false

            - name: Git config
              run: |
                  git config --local user.name "github-actions[bot]"
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Install pinned dependencies without service initialization
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Export local schema and regenerate with pinned tools
              # The script uses network-disabled containers, custom Python templates,
              # and applies security floors before removing generated .github metadata.
              run: bash ${{ env.working-directory }}/generate-python.sh

            - name: Get version from package.json
              id: package-version
              run: |
                  PACKAGE_VERSION="$(bun -e "console.log(require('./services/learn-card-network/brain-service/package.json').version)")"
                  echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

            - name: Create or update PR
              uses: peter-evans/create-pull-request@v7
              with:
                  commit-message: Update ${{ matrix.generator-name }}-client SDK to version ${{ steps.package-version.outputs.version }}
                  title: Update Open API Client SDKs to version ${{ steps.package-version.outputs.version }}
                  body: Generated OpenAPI client SDK for clients.
                  branch: open-api-generator
                  base: main
