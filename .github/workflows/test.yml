name: App shard replay
'on':
    workflow_dispatch: {}
permissions:
    contents: read
    actions: read
env:
    NX_BASE: 1fe2450d45aa1f5e038b7bbb02f61965e72671fc
    NX_HEAD: 13dff3c7d32e9499944aa7c7e31c8db8a2bd40f7
jobs:
    control:
        name: ${{ matrix.role }}
        environment: ci-tests
        runs-on: ubuntu-latest
        timeout-minutes: 55
        strategy:
            fail-fast: false
            matrix:
                role:
                    - control
        env:
            ROLE: ${{ matrix.role }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Freeze benchmark source
              run: |-
                  cp -R scripts/ci-app-shards "$RUNNER_TEMP/"
                  git checkout --quiet --detach 13dff3c7d32e9499944aa7c7e31c8db8a2bd40f7
                  test "$(git rev-parse HEAD)" = "$NX_HEAD"
            - name: Runner identity
              run: echo "Image=$ImageOS $ImageVersion"; lscpu | rg "Model name|^CPU\(s\)"
            - name: Use Composite Setup Action
              uses: ./.github/actions/setup
              with:
                  save-cache: 'false'
            - name: Test recovery validation, manifest diagnostics, and registry retries
              run:
                  node --test scripts/validate-capgo-recovery-version.test.mjs scripts/capgo-manifest-diagnostics.test.mjs scripts/smoketest-npm-packages.test.mjs
                  scripts/wait-for-cli-install.test.mjs .github/tests/test-deploy-test-proof.test.cjs .github/tests/test-capgo-recovery-workflow.test.cjs
            - name: Test shared native registry readiness gate
              run: node --test scripts/wait-for-didkit-registry.test.mjs
            - name: Test AI Agent ECR vulnerability gate
              run: node --test scripts/reject-vulnerable-ecr-image.test.mjs
            - name: Install pinned Rust toolchain
              working-directory: services/escrow-enclave-app
              run: rustup toolchain install
            - name: Authenticate Docker Hub pulls
              uses: ./.github/actions/dockerhub-login
              with:
                  username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
                  token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
            - name: Test retry reporting contract
              run: node --test scripts/ci-test-retries/retry.test.cjs
            - name: Test artifact pilot contracts
              run: node --test scripts/nx-artifact-cache/pilot.test.mjs
            - name: Test queue batch shadow observation
              run: node --test scripts/e2e-hosted/queue-batch-shadow.test.mjs scripts/e2e-hosted/observe-queue-batch.test.mjs scripts/e2e-hosted/queue-proof-shadow.test.mjs
            - name: Test SDK build cache policy when its configuration changes
              run: |
                  if git diff --quiet "$NX_BASE"..."$NX_HEAD" -- \
                      nx.json package.json bun.lock bunfig.toml .nvmrc ':(glob)tsconfig*.json' \
                      packages/learn-card-types packages/learn-card-helpers packages/learn-card-core \
                      tools/executors/workspace/run-command \
                      .github/tests/test-sdk-cache-policy.cjs .github/workflows/test.yml \
                      .github/workflows/nx-artifact-producer.yml scripts/nx-artifact-cache; then
                    echo "SDK cache policy unchanged"
                  else
                    node --test .github/tests/test-sdk-cache-policy.cjs
                    node --test scripts/nx-artifact-cache/native.test.mjs
                  fi
            - name: Freeze affected graph and prepare coverage diagnostics
              run: |-
                  bunx nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --graph="$RUNNER_TEMP/full-graph.json"
                  python3 "$RUNNER_TEMP/ci-app-shards/replay.py" prepare "$ROLE"
            - name: Execute selected tasks
              timeout-minutes: 35
              env:
                  NX_PROFILE: ${{ runner.temp }}/shard-trace.json
                  LC_CI_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
                  LC_CI_TEST_RETRY: '1'
                  APP_REPLAY_FILES: ${{ runner.temp }}/app-cases.json
                  SEED: ${{ secrets.SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
                  LEARN_CLOUD_SEED: ${{ secrets.LEARN_CLOUD_SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
              run: |-
                  case "$ROLE" in
                    control) bunx nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --skip-nx-cache ;;
                    remainder) bunx nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --exclude=learn-card-app --skip-nx-cache ;;
                    app-1|app-2) bunx nx run learn-card-app:test --skip-nx-cache ;;
                  esac
            - name: Verify fresh results and record coverage
              env:
                  LC_CI_NX_OUTCOME: success
                  LC_CI_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
                  APP_REPLAY_FILES: ${{ runner.temp }}/app-cases.json
              run: |-
                  node scripts/ci-test-retries/summary.cjs
                  python3 "$RUNNER_TEMP/ci-app-shards/replay.py" evidence "$ROLE"
            - uses: actions/upload-artifact@v4
              with:
                  name: app-split-${{ github.run_attempt }}-${{ matrix.role }}
                  path: ${{ runner.temp }}/shard-evidence
                  retention-days: 14
                  if-no-files-found: error
    remainder:
        name: ${{ matrix.role }}
        environment: ci-tests
        runs-on: ubuntu-latest
        timeout-minutes: 55
        strategy:
            fail-fast: false
            matrix:
                role:
                    - remainder
        env:
            ROLE: ${{ matrix.role }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
