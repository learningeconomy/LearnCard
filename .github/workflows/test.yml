                  scripts/wait-for-cli-install.test.mjs .github/tests/test-deploy-test-proof.test.cjs .github/tests/test-capgo-recovery-workflow.test.cjs
            - name: Test shared native registry readiness gate
              run: node --test scripts/wait-for-didkit-registry.test.mjs
            - name: Test AI Agent ECR vulnerability gate
              run: node --test scripts/reject-vulnerable-ecr-image.test.mjs
            - name: Install pinned Rust toolchain
              working-directory: services/escrow-enclave-app
