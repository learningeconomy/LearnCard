              env:
                  LC_CI_NX_OUTCOME: success
                  LC_CI_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
                  APP_REPLAY_FILES: ${{ runner.temp }}/app-cases.json
              run: |-
                  node scripts/ci-test-retries/summary.cjs
                  python3 "$RUNNER_TEMP/ci-app-shards/replay.py" evidence "$ROLE"
            - uses: actions/upload-artifact@v4
              with:
                  name: app-split-${{ github.run_attempt }}-${{ matrix.role }}
                  path: ${{ runner.temp }}/shard-evidence
                  retention-days: 14
                  if-no-files-found: error
    join:
        name: Split Test gate
        runs-on: ubuntu-latest
        if: ${{ always() }}
        needs:
            - remainder
            - shards
        steps:
            - name: Require successful runners
              env:
                  REMAINDER: ${{ needs.remainder.result }}
                  SHARDS: ${{ needs.shards.result }}
              run: test "$REMAINDER" = success && test "$SHARDS" = success
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: |-
                      scripts/ci-app-shards
                      apps/learn-card-app/src
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  pattern: app-split-${{ github.run_attempt }}-*
                  merge-multiple: true
                  path: ${{ runner.temp }}/results
            - name: Require the full graph and disjoint app coverage
              run: python3 scripts/ci-app-shards/replay.py gate "$RUNNER_TEMP/results"
