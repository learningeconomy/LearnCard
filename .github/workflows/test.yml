name: Test Runner

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    merge_group:
        types: [checks_requested]
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to test'
                required: true
                default: 'changeset-release/main'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    integration-selection:
        name: Select integration tests
        runs-on: ubuntu-latest
        outputs:
            brain: ${{ steps.selection.outputs.brain }}
            campaigns: ${{ steps.selection.outputs.campaigns }}
            escrow: ${{ steps.selection.outputs.escrow }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.inputs.branch }}
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
            # Repurpose the former recovery-tools runner; do not install the workspace
            # or allocate integration runners just to decide whether tests apply.
            - name: Select integration tests
              id: selection
              continue-on-error: true
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
              run: node scripts/test-ci-selection.cjs

    Test:
        runs-on: ubuntu-latest
        environment: ci-tests
        permissions:
            contents: read
            actions: read
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.inputs.branch }}
                  fetch-depth: 0

            - name: Fetch main for NX comparison
              run: |
                  git fetch --no-tags --prune origin main

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            # Keep recovery regressions on the existing unit-test runner so they
            # cannot delay integration job selection.
            - name: Test recovery validation, manifest diagnostics, and registry retries
              run: node --test scripts/validate-capgo-recovery-version.test.mjs scripts/capgo-manifest-diagnostics.test.mjs scripts/smoketest-npm-packages.test.mjs .github/tests/test-deploy-test-proof.test.cjs

            - name: Test shared native registry readiness gate
              run: node --test scripts/wait-for-didkit-registry.test.mjs

            # The escrow Rust crates share one pinned toolchain; installing it here
            # stops nx's parallel `cargo test` runs racing to install it.
            - name: Install pinned Rust toolchain
              working-directory: services/escrow-enclave-app
              run: rustup toolchain install

            - name: Authenticate Docker Hub pulls
              uses: ./.github/actions/dockerhub-login
              with:
                  username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
                  token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

            - name: Test retry reporting contract
              run: node --test scripts/ci-test-retries/retry.test.cjs

            - name: Test artifact pilot contracts
              run: node --test scripts/nx-artifact-cache/pilot.test.mjs

            - name: Test SDK build cache policy when its configuration changes
              run: |
                  if git diff --quiet origin/main...HEAD -- \
                      nx.json package.json bun.lock bunfig.toml .nvmrc ':(glob)tsconfig*.json' \
                      packages/learn-card-types packages/learn-card-helpers packages/learn-card-core \
                      tools/executors/workspace/run-command \
                      .github/tests/test-sdk-cache-policy.cjs .github/workflows/test.yml \
                      .github/workflows/nx-artifact-producer.yml scripts/nx-artifact-cache; then
                    echo "SDK cache policy unchanged"
                  else
                    node --test .github/tests/test-sdk-cache-policy.cjs
                    node --test scripts/nx-artifact-cache/native.test.mjs
                  fi

            - name: Freeze affected test range
              id: test-range
              run: |
                  base=$(git rev-parse origin/main)
                  head=$(git rev-parse HEAD)
                  echo "base=$base" >> "$GITHUB_OUTPUT"
                  echo "head=$head" >> "$GITHUB_OUTPUT"
                  if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
                    timeout --kill-after=5s 20s bunx nx affected --target=test --base="$base" --head="$head" \
                      --graph="$RUNNER_TEMP/queue-test-selection.json" || echo 'Queue test proof unavailable; tests still run normally.'
                  fi

            - name: Select trusted main artifact for queue pilot
              id: nx-pilot
              if: github.event_name == 'merge_group' && vars.LC_NX_ARTIFACT_PILOT == 'true'
              timeout-minutes: 1
              continue-on-error: true
              uses: actions/github-script@v8
              with:
                  retries: 0
                  script: |
                      const { selectProducer } = require('./scripts/nx-artifact-cache/select-producer.cjs');
                      await selectProducer({ github, context, core });

            - name: Download main build payloads
              id: nx-pilot-download
              if: steps.nx-pilot.outputs.artifact-id != ''
              timeout-minutes: 1
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  artifact-ids: ${{ steps.nx-pilot.outputs.artifact-id }}
                  merge-multiple: true
                  path: ${{ runner.temp }}/nx-pilot-payloads
                  run-id: ${{ steps.nx-pilot.outputs.run-id }}
                  github-token: ${{ github.token }}

            - name: Run tests
              id: tests
              timeout-minutes: 20
              run: |
                  if [ "$LC_NX_PILOT_ACTIVE" = 'true' ]; then
                    node scripts/nx-artifact-cache/run.mjs consume
                  else
                    bunx nx affected --target=test --base="$NX_BASE" --head="$NX_HEAD"
                  fi
              env:
                  LC_NX_PILOT_ACTIVE: ${{ steps.nx-pilot.outputs.active }}
                  LC_NX_PILOT_BASE: ${{ github.event.merge_group.base_sha }}
                  NX_BASE: ${{ steps.test-range.outputs.base }}
                  NX_HEAD: ${{ steps.test-range.outputs.head }}
                  LC_CI_TEST_RETRY: '1'
                  LC_CI_TEST_REPORT_DIR: ${{ runner.temp }}/learncard-ci-test-reports
                  SEED: ${{ secrets.SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
                  LEARN_CLOUD_SEED: ${{ secrets.LEARN_CLOUD_SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}

            - name: Upload numeric queue cache evidence
              if: always() && steps.nx-pilot.outputs.active == 'true'
              timeout-minutes: 1
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: nx-pilot-queue-evidence
                  path: ${{ runner.temp }}/nx-pilot/result.json
                  retention-days: 7

            - name: Summarize test retries
              if: always()
              env:
                  LC_CI_TEST_REPORT_DIR: ${{ runner.temp }}/learncard-ci-test-reports
                  LC_CI_NX_OUTCOME: ${{ steps.tests.outcome }}
              run: node scripts/ci-test-retries/summary.cjs

            - name: Record queue test proof
              id: queue-proof
              if: ${{ success() && github.event_name == 'merge_group' }}
              continue-on-error: true
              env:
                  NX_BASE: ${{ steps.test-range.outputs.base }}
                  NX_HEAD: ${{ steps.test-range.outputs.head }}
              run: node scripts/deploy-test-proof.cjs record "$RUNNER_TEMP/queue-test-selection.json" "$RUNNER_TEMP/queue-test-proof/queue-test-proof.json"

            - name: Publish queue test proof
              if: ${{ success() && github.event_name == 'merge_group' && steps.queue-proof.outputs.publish == 'true' }}
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: queue-test-proof-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/queue-test-proof/queue-test-proof.json
                  if-no-files-found: error
                  retention-days: 7

    escrow-integration:
        name: Escrow integration (lca-api)
        needs: integration-selection
        # Only an explicit, successful skip decision can avoid allocating a runner.
        if: ${{ !cancelled() && (needs.integration-selection.result != 'success' || needs.integration-selection.outputs.escrow != 'false') }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.inputs.branch }}
                  fetch-depth: 0

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            # Live-Mongo (mongodb-memory-server) specs; the nx `test` target only
            # runs vitest.config.ts, so these are otherwise never exercised in CI.
            - name: Run escrow integration specs
              working-directory: services/learn-card-network/lca-api
              run: >-
                  bunx vitest run --config vitest.integration.config.ts
                  test/keys-escrow.spec.ts
                  test/keys-pin-sign-in.spec.ts
                  test/keys-pin-lease.spec.ts
                  test/models/escrow.spec.ts
                  test/jobs/escrowBlobRewrap.spec.ts
                  test/jobs/escrowHoldReminders.spec.ts

    ai-agent:
        name: AI Agent CI
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Pre-step service authentication and troubleshooting: .github/SERVICE_IMAGE_PULLS.md.
        services:
            mongo:
                image: mongo:7
                credentials:
                    username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            CI: true
            AI_AGENT_TEST_MONGO_URI: mongodb://127.0.0.1:27017
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up AI Agent Node LTS
              uses: actions/setup-node@v6
              with:
                  node-version-file: services/learn-card-network/ai-agent/.nvmrc
                  package-manager-cache: false

            - name: Use composite setup action
              uses: ./.github/actions/setup

            - name: Verify Trigger.dev deployment CLI startup
              working-directory: services/learn-card-network/ai-agent
              run: bunx trigger deploy --help

            - name: Test Trigger native package readiness gate
              run: node --test scripts/wait-for-trigger-native-package.test.mjs

            - name: Run AI Agent tests
              run: bun run --cwd services/learn-card-network/ai-agent test -- run

            - name: Verify feed with real DIDKit WASM
              run: bun run --cwd services/learn-card-network/ai-agent smoke:feed-wasm

            - name: Verify private Sentry telemetry
              run: bun run --cwd services/learn-card-network/ai-agent smoke:sentry

            - name: Build AI Agent
              run: bun run --cwd services/learn-card-network/ai-agent build

            - name: Lint CloudFormation template
              run: pipx run cfn-lint services/learn-card-network/ai-agent/infra/aws/template.yml

    brain-graph:
        name: Brain graph integration
        needs: integration-selection
        if: ${{ !cancelled() && (needs.integration-selection.result != 'success' || needs.integration-selection.outputs.brain != 'false') }}
        uses: ./.github/workflows/brain-integration.yml
        with:
            group: graph
            ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.inputs.branch }}
            run_brain: true
            run_campaigns: false
        secrets:
            DOCKERHUB_PULL_USERNAME: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
            DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

    brain-delivery:
        name: Inbox and campaigns integration
        needs: integration-selection
        if: ${{ !cancelled() && (needs.integration-selection.result != 'success' || needs.integration-selection.outputs.brain != 'false' || needs.integration-selection.outputs.campaigns != 'false') }}
        uses: ./.github/workflows/brain-integration.yml
        with:
            group: delivery
            ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.inputs.branch }}
            run_brain: ${{ needs.integration-selection.result != 'success' || needs.integration-selection.outputs.brain != 'false' }}
            run_campaigns: ${{ needs.integration-selection.result != 'success' || needs.integration-selection.outputs.campaigns != 'false' }}
        secrets:
            DOCKERHUB_PULL_USERNAME: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
            DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

    # Temporary manual fallback during the hosted-runner cutover.
    # Remove after one sprint of stable GitHub-hosted E2E operation.
    e2e-tests:
        name: EC2 E2E fallback (manual)
        if: github.event_name == 'workflow_dispatch'
        concurrency:
            group: learncard-e2e-ec2
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Start EC2 instance
              run: |
                  mkdir -p e2e-artifacts
                  set -o pipefail
                  echo "Starting EC2 instance..."
                  curl --silent --show-error --fail-with-body \
                    --retry 3 \
                    --retry-delay 5 \
                    --retry-max-time 30 \
                    "${{ secrets.E2E_EC2_LAMBDA_URL }}/start" 2>&1 \
                    | tee e2e-artifacts/ec2-start.log

            - name: Wait for EC2 to be ready
              run: |
                  echo "Waiting for EC2 instance to be ready..."
                  for i in {1..30}; do
                    STATUS=$(curl -s "${{ secrets.E2E_EC2_LAMBDA_URL }}/status")
                    STATE=$(echo "$STATUS" | grep -i "^State:" | awk '{print $2}')
                    IP=$(echo "$STATUS" | grep -i "^Public IP:" | awk '{print $3}')

                    echo "Attempt $i: state=$STATE, ip=$IP"

                    if [ "$STATE" = "running" ] && [ -n "$IP" ]; then
                      echo "EC2 is running, waiting for SSH to be ready..."
                      for j in {1..30}; do
                        if nc -z -w5 "$IP" 22 2>/dev/null; then
                          echo "SSH is ready at $IP"
                          echo "E2E_EC2_IP=$IP" >> $GITHUB_ENV
                          exit 0
                        fi
                        echo "  SSH not ready yet (attempt $j)..."
                        sleep 5
                      done
                      echo "Timeout waiting for SSH"
                      exit 1
                    fi

                    sleep 10
                  done
                  echo "Timeout waiting for EC2 to be ready"
                  exit 1

            - name: Run E2E tests on EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.E2E_EC2_IP }}
                  username: ${{ secrets.E2E_EC2_USERNAME }}
                  key: ${{ secrets.E2E_EC2_SSH_KEY }}
                  script_stop: true
                  command_timeout: 50m
                  script: |
                      cd ~/learncard-e2e-runner
                      git fetch --no-tags origin main
                      git reset --hard FETCH_HEAD
                      echo "Runner repository resolved to: $(git rev-parse HEAD)"
                      ./scripts/sync-repo.sh ${{ github.head_ref || github.event.inputs.branch }}
                      ./scripts/run-tests.sh

                      # The runner script owns the existing Playwright suite. Run the
                      # Axe-backed core-flow checks explicitly so accessibility remains
                      # part of the same real-backend E2E gate.
                      #
                      # ssh-action opens a non-interactive shell that never sources the
                      # login profile, so the toolchain run-tests.sh resolves for itself
                      # is not on PATH here — without this, `bun` exits 127 and fails the
                      # step even when every Playwright suite has passed.
                      export PATH="$HOME/.bun/bin:$HOME/.node/bin:$PATH"
                      command -v bun >/dev/null || { echo "bun not found on the runner"; exit 1; }

                      cd workspace/LearnCard/apps/learn-card-app
                      bun run test:a11y

            - name: Download Playwright report from EC2
              if: always()
              continue-on-error: true
              run: |
                  mkdir -p playwright-report test-results playwright-report-a11y test-results-a11y
                  echo "${{ secrets.E2E_EC2_SSH_KEY }}" > /tmp/ec2_key
                  chmod 600 /tmp/ec2_key
                  # Download HTML report
                  scp -o StrictHostKeyChecking=no -i /tmp/ec2_key -r \
                    ${{ secrets.E2E_EC2_USERNAME }}@${{ env.E2E_EC2_IP }}:~/learncard-e2e-runner/workspace/LearnCard/apps/learn-card-app/playwright-report/* \
                    playwright-report/ || echo "Failed to download HTML report"
                  # Download JSON results (for job summary parsing)
                  scp -o StrictHostKeyChecking=no -i /tmp/ec2_key -r \
                    ${{ secrets.E2E_EC2_USERNAME }}@${{ env.E2E_EC2_IP }}:~/learncard-e2e-runner/workspace/LearnCard/apps/learn-card-app/test-results/* \
                    test-results/ || echo "Failed to download test results"
                  # Download the Axe suite's report, which writes to its own paths so
                  # it does not overwrite the main Playwright suite's artifacts
                  scp -o StrictHostKeyChecking=no -i /tmp/ec2_key -r \
                    ${{ secrets.E2E_EC2_USERNAME }}@${{ env.E2E_EC2_IP }}:~/learncard-e2e-runner/workspace/LearnCard/apps/learn-card-app/playwright-report-a11y/* \
                    playwright-report-a11y/ || echo "Failed to download a11y HTML report"
                  scp -o StrictHostKeyChecking=no -i /tmp/ec2_key -r \
                    ${{ secrets.E2E_EC2_USERNAME }}@${{ env.E2E_EC2_IP }}:~/learncard-e2e-runner/workspace/LearnCard/apps/learn-card-app/test-results-a11y/* \
                    test-results-a11y/ || echo "Failed to download a11y test results"
                  rm /tmp/ec2_key

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                      playwright-report-a11y/
                      test-results-a11y/
                  retention-days: 30

            - name: Cleanup EC2 (docker down, prune)
              if: ${{ always() && env.E2E_EC2_IP != '' }}
              continue-on-error: true
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.E2E_EC2_IP }}
                  username: ${{ secrets.E2E_EC2_USERNAME }}
                  key: ${{ secrets.E2E_EC2_SSH_KEY }}
                  script_stop: false
                  command_timeout: 10m
                  script: |
                      cd ~/learncard-e2e-runner
                      ./scripts/cleanup.sh

            - name: Download E2E diagnostics from EC2
              if: ${{ always() && env.E2E_EC2_IP != '' }}
              continue-on-error: true
              run: |
                  mkdir -p e2e-artifacts
                  status_file=e2e-artifacts/artifact-transfer-status.txt
                  key_file="$(mktemp)"
                  trap 'rm -f "$key_file"' EXIT
                  printf '%s\n' "${{ secrets.E2E_EC2_SSH_KEY }}" > "$key_file"
                  chmod 600 "$key_file"
                  set +e
                  scp -o StrictHostKeyChecking=no -i "$key_file" -r \
                    ${{ secrets.E2E_EC2_USERNAME }}@${{ env.E2E_EC2_IP }}:~/learncard-e2e-runner/artifacts/. \
                    e2e-artifacts/
                  scp_status=$?
                  set -e
                  if [ "$scp_status" -eq 0 ]; then
                    printf 'success\n' > "$status_file"
                  else
                    printf '%s\n' "$scp_status" > "$status_file"
                  fi
                  exit "$scp_status"

            - name: Upload E2E diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-diagnostics-${{ github.run_id }}
                  path: e2e-artifacts/
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish E2E diagnostic summary
              if: always()
              run: |
                  if [ -f e2e-artifacts/summary.md ]; then
                    cat e2e-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
                  else
                    {
                      echo '## E2E stage timings'
                      echo
                      echo 'Timing summary unavailable.'
                      echo
                      echo 'Artifact transfer status:'
                      if [ -f e2e-artifacts/artifact-transfer-status.txt ]; then
                        cat e2e-artifacts/artifact-transfer-status.txt
                      else
                        echo 'unavailable'
                      fi
                    } >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Stop EC2 instance
              if: always()
              run: |
                  echo "Stopping EC2 instance..."
                  curl -s "${{ secrets.E2E_EC2_LAMBDA_URL }}/stop"
