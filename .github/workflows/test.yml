name: Test Runner

on:
    pull_request:
        types: [opened, synchronize]
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to test'
                required: true
                default: 'changeset-release/main'

jobs:
    Test:
        runs-on: ubuntu-latest
        environment: ci-tests
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.event.inputs.branch }}
                  fetch-depth: 0

            - name: Fetch main for NX comparison
              run: |
                  git fetch --no-tags --prune origin main

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            - name: Run tests
              uses: nick-fields/retry@v2
              with:
                  timeout_minutes: 10
                  max_attempts: 3
                  command: bunx nx affected --target=test --base=origin/main --head=HEAD
              env:
                  SEED: ${{ secrets.SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
                  LEARN_CLOUD_SEED: ${{ secrets.LEARN_CLOUD_SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}

    # Run the real-backend E2E and Axe suites on every PR or manual trigger.
    # SSHs into EC2 to run Playwright tests against the branch
    e2e-tests:
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        concurrency:
            group: learncard-e2e-ec2
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Start EC2 instance
              run: |
                  mkdir -p e2e-artifacts
                  set -o pipefail
                  echo "Starting EC2 instance..."
                  curl --silent --show-error --fail-with-body \
                    --retry 3 \
                    --retry-delay 5 \
                    --retry-max-time 30 \
                    "${{ secrets.E2E_EC2_LAMBDA_URL }}/start" 2>&1 \
                    | tee e2e-artifacts/ec2-start.log

            - name: Wait for EC2 to be ready
              run: |
                  echo "Waiting for EC2 instance to be ready..."
                  for i in {1..30}; do
                    STATUS=$(curl -s "${{ secrets.E2E_EC2_LAMBDA_URL }}/status")
                    STATE=$(echo "$STATUS" | grep -i "^State:" | awk '{print $2}')
                    IP=$(echo "$STATUS" | grep -i "^Public IP:" | awk '{print $3}')

                    echo "Attempt $i: state=$STATE, ip=$IP"

                    if [ "$STATE" = "running" ] && [ -n "$IP" ]; then
                      echo "EC2 is running, waiting for SSH to be ready..."
                      for j in {1..30}; do
                        if nc -z -w5 "$IP" 22 2>/dev/null; then
                          echo "SSH is ready at $IP"
                          echo "E2E_EC2_IP=$IP" >> $GITHUB_ENV
                          exit 0
                        fi
                        echo "  SSH not ready yet (attempt $j)..."
                        sleep 5
                      done
                      echo "Timeout waiting for SSH"
                      exit 1
                    fi

                    sleep 10
                  done
                  echo "Timeout waiting for EC2 to be ready"
                  exit 1

            - name: Run E2E tests on EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.E2E_EC2_IP }}
                  username: ${{ secrets.E2E_EC2_USERNAME }}
                  key: ${{ secrets.E2E_EC2_SSH_KEY }}
                  script_stop: true
                  command_timeout: 50m
                  script: |
                      cd ~/learncard-e2e-runner
                      git fetch --no-tags origin main
                      git reset --hard FETCH_HEAD
                      echo "Runner repository resolved to: $(git rev-parse HEAD)"
                      ./scripts/sync-repo.sh ${{ github.head_ref || github.event.inputs.branch }}
                      ./scripts/run-tests.sh

                      # The runner script owns the existing Playwright suite. Run the
                      # Axe-backed core-flow checks explicitly so accessibility remains
                      # part of the same real-backend E2E gate.
                      #
                      # ssh-action opens a non-interactive shell that never sources the
                      # login profile, so the toolchain run-tests.sh resolves for itself
                      # is not on PATH here — without this, `bun` exits 127 and fails the
                      # step even when every Playwright suite has passed.
                      export PATH="$HOME/.bun/bin:$HOME/.node/bin:$PATH"
                      command -v bun >/dev/null || { echo "bun not found on the runner"; exit 1; }

                      cd workspace/LearnCard/apps/learn-card-app
                      bun run test:a11y

            - name: Download Playwright report from EC2
              if: always()
              continue-on-error: true
              run: |
                  mkdir -p playwright-report test-results
                  echo "${{ secrets.E2E_EC2_SSH_KEY }}" > /tmp/ec2_key
                  chmod 600 /tmp/ec2_key
                  # Download HTML report
                  scp -o StrictHostKeyChecking=no -i /tmp/ec2_key -r \
                    ${{ secrets.E2E_EC2_USERNAME }}@${{ env.E2E_EC2_IP }}:~/learncard-e2e-runner/workspace/LearnCard/apps/learn-card-app/playwright-report/* \
                    playwright-report/ || echo "Failed to download HTML report"
                  # Download JSON results (for job summary parsing)
                  scp -o StrictHostKeyChecking=no -i /tmp/ec2_key -r \
                    ${{ secrets.E2E_EC2_USERNAME }}@${{ env.E2E_EC2_IP }}:~/learncard-e2e-runner/workspace/LearnCard/apps/learn-card-app/test-results/* \
                    test-results/ || echo "Failed to download test results"
                  rm /tmp/ec2_key

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 30

            - name: Cleanup EC2 (docker down, prune)
              if: ${{ always() && env.E2E_EC2_IP != '' }}
              continue-on-error: true
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.E2E_EC2_IP }}
                  username: ${{ secrets.E2E_EC2_USERNAME }}
                  key: ${{ secrets.E2E_EC2_SSH_KEY }}
                  script_stop: false
                  command_timeout: 10m
                  script: |
                      cd ~/learncard-e2e-runner
                      ./scripts/cleanup.sh

            - name: Download E2E diagnostics from EC2
              if: ${{ always() && env.E2E_EC2_IP != '' }}
              continue-on-error: true
              run: |
                  mkdir -p e2e-artifacts
                  status_file=e2e-artifacts/artifact-transfer-status.txt
                  key_file="$(mktemp)"
                  trap 'rm -f "$key_file"' EXIT
                  printf '%s\n' "${{ secrets.E2E_EC2_SSH_KEY }}" > "$key_file"
                  chmod 600 "$key_file"
                  set +e
                  scp -o StrictHostKeyChecking=no -i "$key_file" -r \
                    ${{ secrets.E2E_EC2_USERNAME }}@${{ env.E2E_EC2_IP }}:~/learncard-e2e-runner/artifacts/. \
                    e2e-artifacts/
                  scp_status=$?
                  set -e
                  if [ "$scp_status" -eq 0 ]; then
                    printf 'success\n' > "$status_file"
                  else
                    printf '%s\n' "$scp_status" > "$status_file"
                  fi
                  exit "$scp_status"

            - name: Upload E2E diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-diagnostics-${{ github.run_id }}
                  path: e2e-artifacts/
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish E2E diagnostic summary
              if: always()
              run: |
                  if [ -f e2e-artifacts/summary.md ]; then
                    cat e2e-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
                  else
                    {
                      echo '## E2E stage timings'
                      echo
                      echo 'Timing summary unavailable.'
                      echo
                      echo 'Artifact transfer status:'
                      if [ -f e2e-artifacts/artifact-transfer-status.txt ]; then
                        cat e2e-artifacts/artifact-transfer-status.txt
                      else
                        echo 'unavailable'
                      fi
                    } >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Stop EC2 instance
              if: always()
              run: |
                  echo "Stopping EC2 instance..."
                  curl -s "${{ secrets.E2E_EC2_LAMBDA_URL }}/stop"
