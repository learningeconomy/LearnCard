                  LC_CI_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
                  LC_CI_TEST_RETRY: '1'
                  APP_REPLAY_FILES: ${{ runner.temp }}/app-cases.json
                  SEED: ${{ secrets.SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
                  LEARN_CLOUD_SEED: ${{ secrets.LEARN_CLOUD_SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
              run: |-
                  case "$ROLE" in
                    control) bunx nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --skip-nx-cache ;;
                    remainder) bunx nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --exclude=learn-card-app --skip-nx-cache ;;
                    app-1|app-2) bunx nx run learn-card-app:test --skip-nx-cache ;;
                  esac
            - name: Verify fresh results and record coverage
              env:
                  LC_CI_NX_OUTCOME: success
                  LC_CI_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
                  APP_REPLAY_FILES: ${{ runner.temp }}/app-cases.json
              run: |-
                  node scripts/ci-test-retries/summary.cjs
                  python3 "$RUNNER_TEMP/ci-app-shards/replay.py" evidence "$ROLE"
            - uses: actions/upload-artifact@v4
              with:
                  name: app-split-${{ github.run_attempt }}-${{ matrix.role }}
                  path: ${{ runner.temp }}/shard-evidence
                  retention-days: 14
                  if-no-files-found: error
    shards:
        name: ${{ matrix.role }}
        environment: ci-tests
        runs-on: ubuntu-latest
        timeout-minutes: 55
        strategy:
            fail-fast: false
            matrix:
                role:
                    - app-1
                    - app-2
        env:
            ROLE: ${{ matrix.role }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Freeze benchmark source
              run: |-
                  cp -R scripts/ci-app-shards "$RUNNER_TEMP/"
                  git checkout --quiet --detach 13dff3c7d32e9499944aa7c7e31c8db8a2bd40f7
                  test "$(git rev-parse HEAD)" = "$NX_HEAD"
            - name: Runner identity
              run: echo "Image=$ImageOS $ImageVersion"; lscpu | rg "Model name|^CPU\(s\)"
            - name: Use Composite Setup Action
              uses: ./.github/actions/setup
              with:
                  save-cache: 'false'
            - name: Freeze affected graph and prepare coverage diagnostics
              run: |-
                  bunx nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --graph="$RUNNER_TEMP/full-graph.json"
                  python3 "$RUNNER_TEMP/ci-app-shards/replay.py" prepare "$ROLE"
            - name: Execute selected tasks
              timeout-minutes: 35
              env:
                  NX_PROFILE: ${{ runner.temp }}/shard-trace.json
                  LC_CI_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
                  LC_CI_TEST_RETRY: '1'
                  APP_REPLAY_FILES: ${{ runner.temp }}/app-cases.json
                  SEED: ${{ secrets.SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
                  LEARN_CLOUD_SEED: ${{ secrets.LEARN_CLOUD_SEED || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
              run: |-
                  case "$ROLE" in
                    control) bunx nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --skip-nx-cache ;;
                    remainder) bunx nx affected -t test --base="$NX_BASE" --head="$NX_HEAD" --exclude=learn-card-app --skip-nx-cache ;;
                    app-1|app-2) bunx nx run learn-card-app:test --skip-nx-cache ;;
                  esac
