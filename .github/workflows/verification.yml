name: Navigation timing experiment (scratch only)
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: navigation-timing-${{ github.ref }}
    cancel-in-progress: false
jobs:
    benchmark:
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/lc-2312-navigation-benchmark' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        env:
            LC_VERIFY_TRUST_LOCAL_DOCKER: '1'
        steps:
            - name: Initialize private evidence paths
              run: |
                  umask 077
                  mkdir -p "$RUNNER_TEMP/navigation/private" "$RUNNER_TEMP/navigation-summary"
                  {
                    echo "STACK_DIR=$RUNNER_TEMP/navigation/stack"
                    echo "PRIVATE_LOG_DIR=$RUNNER_TEMP/navigation/private"
                    echo "SUMMARY_DIR=$RUNNER_TEMP/navigation-summary"
                  } >> "$GITHUB_ENV"
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
            - uses: ./.github/actions/setup
              with:
                  save-cache: 'false'
            - name: Install Chromium and Linux libraries
              run: bunx playwright install --with-deps chromium
            - name: Prepare clean checkout and declarations
              run: |
                  bun run --cwd apps/learn-card-app lc verify prepare --dir "$STACK_DIR" > "$PRIVATE_LOG_DIR/prepare.log" 2>&1
                  bunx nx run-many -t build --projects=network-brain-service,learn-cloud-service,lca-api-service --parallel=1 --skip-nx-cache > "$PRIVATE_LOG_DIR/declarations.log" 2>&1
                  bunx tsc -p apps/learn-card-app/scripts/verification/tsconfig.json > "$PRIVATE_LOG_DIR/typecheck.log" 2>&1
            - name: Start one owned stack and bootstrap sessions
              id: stack
              run: bun run --cwd apps/learn-card-app lc verify up --json --dir "$STACK_DIR" > "$PRIVATE_LOG_DIR/startup.jsonl" 2> "$PRIVATE_LOG_DIR/startup.log"
            - name: Compare immutable baseline and candidate drivers (ABBA)
              id: trials
              run: python3 scripts/navigation-benchmark.py
            - name: Always tear down owned resources
              id: teardown
              if: ${{ always() }}
              run: |
                  if [[ -f "$STACK_DIR/state.json" ]]; then
                    bun run --cwd apps/learn-card-app lc verify down --force --dir "$STACK_DIR" > "$PRIVATE_LOG_DIR/teardown.log" 2>&1
                  fi
            - name: Sanitize timing and coverage reports
              timeout-minutes: 2
              if: ${{ always() }}
              env:
                  STARTUP_OUTCOME: ${{ steps.stack.outcome }}
                  VERIFICATION_OUTCOME: ${{ steps.trials.outcome }}
                  TEARDOWN_OUTCOME: ${{ steps.teardown.outcome }}
              run: |
                  node scripts/summarize-verification.mjs "$STACK_DIR" "$SUMMARY_DIR"
                  python3 -B scripts/profile-verification-traces.py "$STACK_DIR" "$SUMMARY_DIR"
            - name: Upload sanitized numbers only
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: navigation-timing-${{ github.run_id }}
                  path: ${{ runner.temp }}/navigation-summary
                  retention-days: 14
                  if-no-files-found: error
