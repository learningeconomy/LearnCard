# .github/workflows/chromatic.yml
# Publishes Storybook to Chromatic for visual regression testing.
# Docs: https://www.chromatic.com/docs/github-actions/
#
# Snapshot budget: Chromatic bills per story snapshot, and the app's Storybook depends on
# nearly the whole workspace, so gating on "is learn-card-app NX-affected" ran a full publish
# on almost every PR. Instead, each job runs only when files that can change what Storybook
# renders are touched: story files, Storybook config, and the component source that stories
# import. Changes elsewhere in the monorepo skip Chromatic entirely.

name: 'Chromatic'

on:
    # Keep a current baseline build for every main commit that touches Storybook. Without
    # this, Chromatic cannot compare a PR once its merge base advances past the last
    # published build.
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: chromatic-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

env:
    CI: true
    # The app's Storybook build bundles the whole app (~13k modules) and needs
    # more than the default/4096 MB heap — 8 GB verified locally. (Raised after
    # i18n'd components pushed the build past the previous ceiling.)
    NODE_OPTIONS: '--max_old_space_size=8192'

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            react: ${{ steps.filter.outputs.react }}
            learn-card-app: ${{ steps.filter.outputs.learn-card-app }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  # On push to main, paths-filter diffs against github.event.before. Fetching
                  # depth 2 keeps that commit local for squash merges (the action fetches deeper
                  # itself when a push contains more commits, and uses the PR base on PRs).
                  fetch-depth: 2

            - name: Detect Storybook-relevant changes
              uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      react:
                        - 'packages/react-learn-card/.storybook/**'
                        - 'packages/react-learn-card/src/**'
                        - 'packages/react-learn-card/package.json'
                        - '.github/workflows/chromatic.yml'
                      learn-card-app:
                        - 'apps/learn-card-app/.storybook/**'
                        - 'apps/learn-card-app/src/**/*.stories.ts'
                        - 'apps/learn-card-app/src/**/*.stories.tsx'
                        - 'packages/learn-card-base/src/components/**'
                        - 'packages/react-learn-card/src/components/**'
                        - '.github/workflows/chromatic.yml'

    chromatic-deployment:
        needs: changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.react == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  # Chromatic needs full git history to compare against the baseline.
                  fetch-depth: 0

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            - name: Build @learncard/react
              run: bunx nx build react

            - name: Publish to Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
                  workingDir: packages/react-learn-card
                  # TurboSnap: only snapshot stories whose files (or their dependencies) changed
                  # since the baseline.
                  onlyChanged: true
                  # Don't fail the build on visual changes — they're reviewed in Chromatic's UI.
                  exitZeroOnChanges: true

    chromatic-learn-card-app:
        needs: changes
        if: needs.changes.outputs.learn-card-app == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  # Chromatic needs full git history to compare against the baseline.
                  fetch-depth: 0

            - name: Use Composite Setup Action
              uses: ./.github/actions/setup

            # The app's Storybook imports workspace packages from their built dist/ output, so the
            # app's entire transitive dependency closure must be compiled first. The closure is derived
            # from the nx graph at runtime (rather than hardcoded) so new dependencies are covered
            # automatically. run-many skips any project in the closure that has no build target.
            - name: Build workspace dependencies
              run: |
                  bunx nx graph --focus=learn-card-app --file=dep-graph.json
                  PROJECTS=$(bun -e "const g=require('./dep-graph.json');const deps=g.graph.dependencies;const seen=new Set();const q=['learn-card-app'];while(q.length){const n=q.pop();for(const d of (deps[n]||[])){if(d.target.startsWith('npm:'))continue;if(!seen.has(d.target)){seen.add(d.target);q.push(d.target);}}}process.stdout.write([...seen].join(','));")
                  bunx nx run-many -t build --projects="$PROJECTS"

            - name: Publish to Chromatic
              uses: chromaui/action@latest
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN_LCA }}
                  workingDir: apps/learn-card-app
                  # The app has no prebuilt Storybook output, so let Chromatic run the build script.
                  buildScriptName: build-storybook
                  # TurboSnap: only snapshot stories whose files (or their dependencies) changed
                  # since the baseline. Storybook 8 + Vite generates the dependency stats natively,
                  # so no extra --stats-json flag is needed when Chromatic builds Storybook itself.
                  onlyChanged: true
                  # Don't fail the build on visual changes — they're reviewed in Chromatic's UI.
                  exitZeroOnChanges: true
