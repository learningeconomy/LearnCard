name: E2E cache warm

# E2E bakes read their dependency layers from GHA cache scopes. Caches written
# from merge-queue refs are unreadable by any later run, and PR-ref caches only
# by that PR, so e2e.yml never exports from merge groups. This refreshes the
# dependency-only scopes from main, which every PR and merge group can read.
# The targets stop before source layers, so only manifest/lockfile changes
# (and eviction, hence the schedule) require a refresh.

on:
    push:
        branches: [main]
        paths:
            - 'bun.lock'
            - 'bunfig.toml'
            - '**/package.json'
            - 'patches/**'
            - 'Dockerfile.monorepo'
            - 'scripts/e2e-hosted/docker-bake.hcl'
            - 'services/playwright-delete-service/**'
            - '.github/workflows/e2e-cache-warm.yml'
    schedule:
        # Re-create the scopes if cache pressure evicted them overnight.
        - cron: '17 11 * * 1-5'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    warm:
        name: Warm E2E dependency caches
        if: ${{ github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Authenticate Docker Hub pulls
              uses: ./.github/actions/dockerhub-login
              with:
                  username: ${{ secrets.DOCKERHUB_PULL_USERNAME }}
                  token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  cleanup: false

            - name: Expose GitHub Actions cache runtime
              uses: crazy-max/ghaction-github-runtime@v3

            # Cache-only outputs: nothing is loaded or pushed; each target imports
            # and re-exports its own scope exactly as the E2E jobs would.
            - name: Export E2E dependency caches
              env:
                  E2E_EXPORT_BROWSER_CACHE: 'true'
                  E2E_EXPORT_BACKEND_CACHE: 'true'
              run: |
                  docker buildx bake --file scripts/e2e-hosted/docker-bake.hcl \
                    dependency-cache backend-dependency-cache browser-delete \
                    --set browser-delete.output=type=cacheonly \
                    --progress=plain
