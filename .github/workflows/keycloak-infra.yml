name: Keycloak Infrastructure

on:
    pull_request:
        paths:
            - 'infra/aws/bootstrap/**'
            - 'infra/keycloak/**'
            - '.github/workflows/keycloak-infra.yml'
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment
                required: true
                default: staging
                type: choice
                options:
                    - staging
                    - production
            root:
                description: Terraform root (bootstrap remains human-owned)
                required: true
                default: service
                type: choice
                options:
                    - network
                    - service
            action:
                description: Plan or apply the reviewed infrastructure
                required: true
                default: plan
                type: choice
                options:
                    - plan
                    - apply

permissions:
    contents: read

env:
    TF_IN_AUTOMATION: 'true'
    TF_INPUT: 'false'

jobs:
    validate:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                root:
                    - infra/aws/bootstrap
                    - infra/keycloak/terraform/network
                    - infra/keycloak/terraform/service
        defaults:
            run:
                working-directory: ${{ matrix.root }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: '1.15.8'
            - run: terraform fmt -check -recursive
            - run: terraform init -backend=false
            - run: terraform validate
            - uses: terraform-linters/setup-tflint@v4
              with:
                  tflint_version: v0.55.1
            - name: Lint Terraform (blocking)
              run: tflint --init && tflint

    build-image:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Build optimized Keycloak image (no push)
              run: docker build --build-arg KEYCLOAK_VERSION=26.7.4 -f infra/keycloak/Dockerfile infra/keycloak

    # No environment here: it changes the OIDC subject from pull_request to
    # environment:keycloak-staging, which the plan role deliberately does not trust.
    # Mirror keycloak-staging's AWS_PLAN_ROLE_ARN into the repository variable
    # KEYCLOAK_STAGING_PLAN_ROLE_ARN; environment-scoped vars are unavailable here.
    # This isolated identity smoke check NEVER checks out or executes PR code,
    # downloads artifacts, or runs Terraform. Credentialed PR plans are Phase 4.
    # Same-repo maintainers are a trust boundary, not a substitute for reviewing
    # workflow changes: the IAM pull_request subject cannot distinguish forks.
    # Skipped until bootstrap is applied and KEYCLOAK_STAGING_PLAN_ROLE_ARN is set.
    pr-plan-role:
        if: >-
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
            vars.KEYCLOAK_STAGING_PLAN_ROLE_ARN != ''
        needs: [validate, build-image]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - name: Verify staging plan-role OIDC authentication (no PR code)
              uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: ${{ vars.KEYCLOAK_STAGING_PLAN_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
                  role-duration-seconds: 900
                  unset-current-credentials: true

    # GitHub environments must also enforce main-only deployment branches;
    # production must require reviewers and prevent self-approval.
    # Both manual actions use the deploy role: the plan role does not trust an
    # environment subject. There is no push trigger or automatic deployment.
    deploy:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        needs: [validate, build-image]
        runs-on: ubuntu-latest
        environment: keycloak-${{ inputs.environment }}
        permissions:
            contents: read
            id-token: write
        concurrency:
            group: keycloak-infra-${{ inputs.environment }}
            cancel-in-progress: false
        defaults:
            run:
                working-directory: infra/keycloak/terraform/${{ inputs.root }}
        env:
            DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
            TF_ROOT: ${{ inputs.root }}
            AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
            TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
            DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
            TF_VAR_keycloak_image: ${{ inputs.root == 'service' && vars.KEYCLOAK_CONTAINER_IMAGE || '' }}
            TF_VAR_bootstrap_admin_password_secret_arn: ${{ inputs.root == 'service' && vars.KEYCLOAK_BOOTSTRAP_ADMIN_SECRET_ARN || '' }}
            TF_VAR_db_rotation_risk_acknowledged: ${{ vars.KEYCLOAK_DB_ROTATION_RISK_ACKNOWLEDGED || 'false' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: '1.15.8'
            - name: Check deployment configuration
              shell: bash
              run: |
                  : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET in the GitHub environment}"
                  : "${DEPLOY_ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN in the GitHub environment}"
                  test -s "environments/${DEPLOY_ENVIRONMENT}.tfvars"
                  if [[ "${TF_ROOT}" == service ]]; then
                      : "${TF_VAR_keycloak_image:?Set KEYCLOAK_CONTAINER_IMAGE in the GitHub environment}"
                      : "${TF_VAR_bootstrap_admin_password_secret_arn:?Set KEYCLOAK_BOOTSTRAP_ADMIN_SECRET_ARN in the GitHub environment}"
                      if [[ ! "${TF_VAR_keycloak_image}" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
                          echo 'KEYCLOAK_CONTAINER_IMAGE must be an image reference pinned by sha256 digest.' >&2
                          exit 1
                      fi
                  fi
            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
                  unset-current-credentials: true
            - name: Initialize remote state
              run: |
                  terraform init \
                      -backend-config="bucket=${TF_STATE_BUCKET}" \
                      -backend-config="key=keycloak/${DEPLOY_ENVIRONMENT}/${TF_ROOT}.tfstate" \
                      -backend-config="region=${AWS_REGION}" \
                      -backend-config="encrypt=true" \
                      -backend-config="use_lockfile=true"
            - name: Plan
              run: |
                  umask 077
                  terraform plan -lock-timeout=5m \
                      -var-file="environments/${DEPLOY_ENVIRONMENT}.tfvars" \
                      -var="environment=${DEPLOY_ENVIRONMENT}" \
                      -var="aws_region=${AWS_REGION}" \
                      -out=keycloak.tfplan
            - name: Apply saved plan
              if: inputs.action == 'apply'
              run: terraform apply -lock-timeout=5m -auto-approve keycloak.tfplan
            - name: Remove sensitive local plan (never uploaded)
              if: always()
              run: rm -f keycloak.tfplan
