name: Keycloak Staging Health Check

on:
    schedule:
        - cron: '*/5 * * * *' # Every 5 minutes
    workflow_dispatch:

permissions:
    contents: read

jobs:
    health-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Setup K6
              run: |
                  sudo apt-get update
                  sudo apt-get install -y k6

            - name: Check JWKS discovery
              id: jwks
              continue-on-error: true
              run: |
                  curl -sf https://auth.staging.learncard.app/realms/learncard/.well-known/openid-configuration > /dev/null
                  echo "jwks_status=success" >> "$GITHUB_OUTPUT"

            - name: JWKS discovery warning
              if: steps.jwks.outcome == 'failure' && env.KEYCLOAK_STAGING_REALM_LIVE != 'true'
              run: |
                  echo "::warning::JWKS discovery failed. Set KEYCLOAK_STAGING_REALM_LIVE=true to enable staging checks."

            - name: Run probe (5 min)
              if: env.KEYCLOAK_STAGING_REALM_LIVE == 'true'
              run: |
                  k6 run infra/keycloak/qa/probe.js -e HOST=auth.staging.learncard.app --duration 5m --vus 5

            - name: Admin 403 check
              run: |
                  STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://auth.staging.learncard.app/admin/)
                  if [[ "$STATUS" != "403" ]]; then
                    echo "::error::Admin endpoint returned $STATUS, expected 403"
                    exit 1
                  fi
                  echo "Admin endpoint correctly returns 403"

            - name: Report results
              if: always()
              run: |
                  echo "Health check completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                  echo "JWKS: ${{ steps.jwks.outputs.jwks_status }}"
                  echo "Admin: 403 OK"
