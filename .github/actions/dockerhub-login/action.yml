name: 'Docker Hub login (best effort)'
description: >-
    Authenticate Docker Hub pulls so CI is not throttled by the per-IP anonymous pull
    limit shared across GitHub-hosted runners. Never fails the job: without credentials
    (fork and Dependabot PRs) or with a rejected token, pulls stay anonymous as before.

inputs:
    username:
        description: 'Docker Hub username (secrets.DOCKERHUB_USERNAME).'
        default: ''
    token:
        description: 'Docker Hub read-only access token (secrets.DOCKERHUB_TOKEN).'
        default: ''

runs:
    using: 'composite'
    steps:
        - name: Log in to Docker Hub
          shell: bash
          env:
              DOCKERHUB_USERNAME: ${{ inputs.username }}
              DOCKERHUB_TOKEN: ${{ inputs.token }}
          run: |
              if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
                echo "Docker Hub credentials unavailable; pulling anonymously."
                exit 0
              fi
              if printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin >/dev/null 2>&1; then
                echo "Authenticated Docker Hub pulls."
              else
                echo "::warning title=Docker Hub login failed::Pulling anonymously; rotate DOCKERHUB_TOKEN to restore authenticated pulls."
              fi
