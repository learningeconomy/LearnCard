name: 'Setup Bun and Install Dependencies'
description: 'A composite action to set up the environment for CI/CD jobs.'

inputs:
    save-cache:
        description: 'Save the Bun dependency cache after the job; disable for cache consumers.'
        default: 'true'

runs:
    using: 'composite'
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: 1.4.2

        - name: Restore Bun cache
          if: ${{ inputs.save-cache != 'true' }}
          uses: actions/cache/restore@v6
          with:
              path: ~/.bun/install/cache
              key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
              restore-keys: |
                  ${{ runner.os }}-bun-

        - name: Setup Bun cache
          if: ${{ inputs.save-cache == 'true' }}
          uses: actions/cache@v6
          with:
              path: ~/.bun/install/cache
              key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
              restore-keys: |
                  ${{ runner.os }}-bun-

        - name: Disable optional MongoDB binary download
          shell: bash
          run: echo "MONGOMS_DISABLE_POSTINSTALL=1" >> "$GITHUB_ENV"

        - name: Install dependencies
          shell: bash
          run: bun install --frozen-lockfile
