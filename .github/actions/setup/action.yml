name: 'Setup Bun and Install Dependencies'
description: 'A composite action to set up the environment for CI/CD jobs.'

inputs:
    dependency-cache:
        description: 'Restore/save the Bun package cache; false installs into a fresh runner-local store'
        default: 'true'
    save-cache:
        description: 'Save the Bun dependency cache after the job; disable for cache consumers.'
        default: 'true'

runs:
    using: 'composite'
    steps:
        - name: Setup Node
          uses: actions/setup-node@v6
          with:
              node-version-file: .nvmrc

        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: 1.4.4

        - name: Configure dependency cache
          shell: bash
          env:
              DEPENDENCY_CACHE: ${{ inputs.dependency-cache }}
          run: |
              case "$DEPENDENCY_CACHE" in
                true) ;;
                false)
                  echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/learncard-bun-cache" >> "$GITHUB_ENV"
                  ;;
                *) echo 'dependency-cache must be true or false' >&2; exit 1 ;;
              esac

        - name: Restore Bun cache
          if: ${{ inputs.dependency-cache == 'true' && inputs.save-cache != 'true' }}
          uses: actions/cache/restore@v6
          with:
              path: ~/.bun/install/cache
              key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
              restore-keys: |
                  ${{ runner.os }}-bun-

        - name: Setup Bun cache
          if: ${{ inputs.dependency-cache == 'true' && inputs.save-cache == 'true' }}
          uses: actions/cache@v6
          with:
              path: ~/.bun/install/cache
              key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
              restore-keys: |
                  ${{ runner.os }}-bun-

        - name: Disable optional MongoDB binary download
          shell: bash
          run: echo "MONGOMS_DISABLE_POSTINSTALL=1" >> "$GITHUB_ENV"

        - name: Install dependencies
          shell: bash
          run: bun install --frozen-lockfile
