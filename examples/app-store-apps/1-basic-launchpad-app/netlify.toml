#############################################
##  Configuration for Netlify deployments  ##
#############################################

[build.environment]
BUN_VERSION = "1.4.4"
BUN_FLAGS = "--ignore-scripts"
NODE_VERSION = "24.22.1"
NODE_OPTIONS = "--max-old-space-size=4096"
SKIP_DIDKIT_NAPI = "1"

# Global Context Default
[build]
command = "bunx nx build 1-basic-launchpad-app"
publish = "dist/"

[[headers]]
for = "/*"
[headers.values]
Access-Control-Allow-Origin = "*"
