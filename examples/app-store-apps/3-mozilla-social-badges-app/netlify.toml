[build.environment]
BUN_VERSION = "1.4.4"
BUN_FLAGS = "--ignore-scripts"
NODE_VERSION = "24.22.1"
NODE_OPTIONS = "--max-old-space-size=4096"
SKIP_DIDKIT_NAPI = "1"

[build]
command = "bunx nx run @learncard/app-store-demo-mozilla-social-badges:build"
  publish = "dist"

[context.production.environment]
  NODE_VERSION = "24.22.1"

[context.deploy-preview.environment]
  NODE_VERSION = "24.22.1"

[context.branch-deploy.environment]
  NODE_VERSION = "24.22.1"
