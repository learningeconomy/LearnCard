# fly.toml app configuration file generated for staging-lca-backend on 2026-10-29T17:20:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'staging-lca-backend'
primary_region = 'lax'

[build]
  [build.args]
    NEXT_PUBLIC_EXAMPLE = 'Value goes here'

[env]
  PORT = '8080'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
